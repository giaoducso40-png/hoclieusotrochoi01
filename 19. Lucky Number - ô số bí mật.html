  syncUI(){qsa('[data-action="mute"]').forEach(b=>{const off=config.muted;b.classList.remove("sound-on","sound-ready","sound-off");b.classList.add(this.uiState());b.innerHTML=icon(off?"mute":"volume");b.setAttribute("aria-pressed",String(!off));b.setAttribute("aria-label",off?"Bật âm thanh":"Tắt âm thanh");b.title=off?"Âm thanh đang tắt":"Âm thanh đang bật"})},
  setVolume(v){config.volume=Math.max(0,Math.min(1,v));if(this.bg)this.bg.volume=config.muted?0:config.volume;if(this.fx)this.fx.volume=config.muted?0:config.volume;saveConfig();updateVolumeUI();this.syncUI()},
  async toggleSound(){this.init();if(this.isPlaying()){config.muted=true;this.pauseBg();this.stopFx();saveConfig();updateVolumeUI();this.syncUI();return}if(config.muted)config.muted=false;saveConfig();const played=await this.playBg(!!this.bg);if(!played)this.beep(true);updateVolumeUI();this.syncUI()},
  async playBg(resume=false){if(!config.music||!this.unlocked||config.muted){this.syncUI();return false}this.stopFx();if(!this.bg||!resume){const name=this.pick(this.bgNames,"lastBg");this.bg=new Audio(name);this.bg.loop=false;this.bg.addEventListener("ended",()=>this.playBg(false),{once:true})}this.bg.volume=config.volume;try{if(resume&&this.savedTrack===this.bg.src)this.bg.currentTime=this.savedTime||0;await this.bg.play();this.syncUI();return true}catch{this.syncUI();return false}},
  pauseBg(){if(this.bg){this.savedTrack=this.bg.src;this.savedTime=this.bg.currentTime||0;this.bg.pause()}this.syncUI()},
  stopFx(){if(this.fx){this.fx.pause();this.fx.currentTime=0;this.fx=null}this.syncUI()},
  feedback(correct){this.pauseBg();this.stopFx();const name=this.pick(correct?this.correctNames:this.wrongNames,correct?"lastCorrect":"lastWrong");const fx=this.fx=new Audio(name);fx.volume=config.muted?0:config.volume;let done=false;const resume=()=>{if(done)return;done=true;this.stopFx();this.playBg(true)};fx.addEventListener("ended",resume,{once:true});fx.addEventListener("error",()=>{this.beep(correct);setTimeout(resume,800)},{once:true});try{fx.play().then(()=>this.syncUI()).catch(()=>{this.beep(correct);setTimeout(resume,800)})}catch{this.beep(correct);setTimeout(resume,800)}setTimeout(resume,4200)},
  beep(ok){if(!this.ctx||config.muted)return;try{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.frequency.value=ok?660:190;g.gain.setValueAtTime(.001,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.08*config.volume,this.ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.35);o.connect(g).connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.36)}catch{}},
  pauseAll(){this.pauseBg();this.stopFx()}
};

let config=loadConfig();
let game=loadGame();
let setupStep=1,setupMode="quick",timerId=null,previousState=null;
function defaultConfig(){return{questions:deepClone(SAMPLE_QUESTIONS),teamCount:2,teams:Array.from({length:6},(_,i)=>({name:`ĐỘI ${i+1}`,color:TEAM_COLORS[i],badge:i+1})),boardSize:20,points:10,timer:20,wrongMode:"played",lucky:false,shuffle:true,volume:1,muted:false,music:true}}
function loadConfig(){try{const v=JSON.parse(localStorage.getItem(CONFIG_KEY));return{...defaultConfig(),...v}}catch{return defaultConfig()}}
function saveConfig(){try{localStorage.setItem(CONFIG_KEY,JSON.stringify(config))}catch(e){recordError(e)}}
function loadGame(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));return v&&v.version===1?v:null}catch{return null}}
function saveGame(){if(!game)return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(game))}catch(e){recordError(e)}}
function fisher(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){const count=Math.max(1,Math.min(config.boardSize,config.questions.length)),ids=config.questions.slice(0,count).map(q=>q.id),mapping=config.shuffle?fisher(ids):ids;game={version:1,state:"BOARD_PICK",teams:deepClone(config.teams.slice(0,config.teamCount)).map(t=>({...t,score:0})),currentTeam:0,tileStates:Array(count).fill("normal"),mapping,currentTile:null,selectedAnswer:null,answeredCorrect:null,timeLeft:config.timer,startedAt:Date.now(),luckyTiles:config.lucky?[Math.floor(Math.random()*count)]:[],settings:{boardSize:count,points:config.points,timer:config.timer,wrongMode:config.wrongMode,lucky:config.lucky},errors:[]};saveGame();AudioManager.playBg(false);renderGame()}
function currentQuestion(){if(!game||game.currentTile===null)return null;const id=game.mapping[game.currentTile];return config.questions.find(q=>q.id===id)||SAMPLE_QUESTIONS.find(q=>q.id===id)||null}

function header({playing=false}={}){return `<header class="topbar"><div class="brand"><span class="brand-mark">${icon("check")}</span><span class="brand-name">LUCKY NUMBER</span></div><div class="top-center">${playing?`<span class="pill">LƯỢT: <strong>${esc(game.teams[game.currentTeam].name)}</strong></span><span class="pill"><strong>${game.tileStates.filter(x=>x==="done").length}</strong> / ${game.tileStates.length} Ô</span>`:`<span class="pill">Ô SỐ BÍ MẬT</span>`}</div><div class="top-actions">${playing?`<button class="icon-btn" data-action="pause" aria-label="Tạm dừng">${icon("pause")}</button>`:""}<button class="icon-btn sound-btn ${AudioManager.uiState()}" data-action="mute" aria-label="${config.muted?"Bật":"Tắt"} âm thanh" aria-pressed="${!config.muted}">${icon(config.muted?"mute":"volume")}</button><span class="volume-value">${Math.round(config.volume*100)}%</span><button class="icon-btn" data-action="volume-down" aria-label="Giảm âm lượng">−</button><button class="icon-btn" data-action="volume-up" aria-label="Tăng âm lượng">+</button>${playing?`<button class="icon-btn" data-action="help" aria-label="Hướng dẫn">${icon("help")}</button>`:""}<button class="icon-btn" data-action="fullscreen" aria-label="Toàn màn hình">${icon("full")}</button>${playing?`<button class="icon-btn" data-action="home" aria-label="Về màn chính trò chơi">${icon("home")}</button>`:""}</div></header>`}
function renderHome(){stopTimer();game&&saveGame();app.innerHTML=`<section class="screen">${header()}<main class="home-main"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-dot"></span> Gameshow giáo dục</div><h1 class="hero-title"><span class="lucky">LUCKY NUMBER</span><span class="secret">Ô SỐ BÍ MẬT</span></h1><p class="tagline">Chọn ô thông minh · Trả lời thật nhanh · Chinh phục bảng số</p><div class="hero-actions"><button class="btn btn-primary" data-action="quick-start">${icon("play")} BẮT ĐẦU TRÒ CHƠI</button><button class="btn btn-secondary" data-action="setup-questions">${icon("file")} NHẬP CÂU HỎI</button><button class="btn btn-soft" data-action="setup-paste">${icon("paste")} DÁN NHANH</button><button class="btn btn-secondary" data-action="setup-settings">${icon("settings")} CÀI ĐẶT</button><button class="btn btn-soft" data-action="import-file">${icon("upload")} NHẬP FILE</button></div><div class="hero-utils"><button class="utility-btn" data-action="continue" ${game?"":"disabled"}>${icon("refresh")} TIẾP TỤC</button><button class="utility-btn" data-action="help">${icon("help")} HƯỚNG DẪN</button><button class="utility-btn" data-action="library">${icon("home")} TẤT CẢ CÁC TRÒ CHƠI</button></div></div><div class="hero-visual"><div class="hero-halo"></div>${ASSETS.board?`<img class="board-art" src="${ASSETS.board}" alt="Bảng ô số 2.5D">`:""}<div class="hero-board-grid" aria-hidden="true">${Array.from({length:20},(_,i)=>`<div class="demo-tile">${String(i+1).padStart(2,"0")}</div>`).join("")}</div><div class="float-chip one">4 lựa chọn · <strong>1 đáp án</strong></div><div class="float-chip two">1–6 đội thi đua</div></div></main></section>`;AudioManager.syncUI();updateDebug()}

function scoreCards(){const cols=game.teams.length<=3?game.teams.length:game.teams.length<=4?2:3;return `<div class="score-grid" style="--team-cols:${cols}">${game.teams.map((t,i)=>`<article class="team-card ${i===game.currentTeam?"active":""}" style="--team:${t.color}"><div class="team-badge">${t.badge}</div><div class="team-info"><div class="team-name">${esc(t.name)}</div><div class="turn-label">${i===game.currentTeam?"Đang chọn ô":"Điểm hiện tại"}</div></div><div class="team-score">${t.score}</div></article>`).join("")}</div>`}
function numberBoard(){const count=game.tileStates.length;return `<section class="board-panel"><div class="panel-title"><span>BẢNG Ô SỐ BÍ MẬT</span><span class="board-meta">${game.tileStates.filter(x=>x==="done").length}/${count} đã mở</span></div><div class="number-grid" style="${BoardLayoutManager.style(count)}">${game.tileStates.map((s,i)=>`<button class="number-tile ${s} ${game.currentTile===i&&game.state!=="BOARD_PICK"?"active":""} ${game.luckyTiles.includes(i)?"lucky":""}" data-action="tile" data-index="${i}" ${s==="done"||game.state!=="BOARD_PICK"?"disabled":""} aria-label="Ô số ${i+1}">${String(i+1).padStart(2,"0")}</button>`).join("")}</div></section>`}
function emptyQuestion(){const team=game.teams[game.currentTeam];return `<section class="empty-question"><div class="empty-copy"><div class="question-label">LƯỢT CỦA ${esc(team.name)}</div><h2>Hãy chọn một ô số!</h2><p>Mỗi ô mở ra một câu hỏi A–B–C–D. Trả lời đúng để ghi <strong>+${game.settings.points} điểm</strong>.</p></div>${ASSETS.trophy?`<img class="empty-art" src="${ASSETS.trophy}" alt="Cúp chiến thắng">`:""}</section>`}
function questionPanel(){const q=currentQuestion();if(!q)return emptyQuestion();const resolved=["CORRECT","WRONG"].includes(game.state),long=q.question.length>160||q.answers.some(a=>a.length>70);return `<section class="prompt-card"><div class="question-label">Ô SỐ ${String(game.currentTile+1).padStart(2,"0")} ${game.timeLeft!==null&&game.settings.timer?`· <span id="timerValue">${game.timeLeft}s</span>`:""}</div><div class="question-text">${esc(q.question)}</div></section><section class="answer-grid ${long?"answers-long":""}">${q.answers.map((a,i)=>{let c="";if(resolved&&i===q.correct)c="correct";else if(resolved&&i===game.selectedAnswer&&i!==q.correct)c="wrong";return `<button class="answer-card ${c}" data-action="answer" data-index="${i}" ${game.state!=="QUESTION"?"disabled":""}><span class="answer-badge">${"ABCD"[i]}</span><span>${esc(a)}</span><span class="answer-mark">${c==="correct"?"✓":c==="wrong"?"×":""}</span></button>`}).join("")}</section>${resolved?feedbackBar(q):`<footer class="feedback-bar"><div><div class="feedback-title">Chọn một đáp án</div><div class="feedback-detail">Mỗi câu chỉ được trả lời một lần.</div></div><button class="feedback-next" data-action="skip-turn">CHUYỂN LƯỢT</button></footer>`}`}
function feedbackBar(q){const ok=game.answeredCorrect;return `<footer class="feedback-bar ${ok?"good":"bad"}"><div><div class="feedback-title">${ok?`CHÍNH XÁC! +${game.settings.points} ĐIỂM`:"CHƯA CHÍNH XÁC!"}</div><div class="feedback-detail">${esc(q.explanation||`Đáp án đúng là ${"ABCD"[q.correct]}.`)}</div></div><button class="feedback-next" data-action="next-turn">TIẾP TỤC</button></footer>`}
function renderGame(){if(!game)return renderHome();if(game.state==="COMPLETED")return renderResult();const active=game.currentTile!==null&&game.state!=="BOARD_PICK";app.innerHTML=`<section class="screen">${header({playing:true})}<main class="game-main"><aside class="game-left">${scoreCards()}${numberBoard()}<div class="left-footer"><div class="status-strip"><span class="status-dot"></span>${active?"Đang trả lời ô đã chọn":"Sẵn sàng chọn ô"}</div><button class="utility-btn" data-action="skip-turn">CHUYỂN LƯỢT</button></div></aside><section class="question-zone">${active?questionPanel():emptyQuestion()}</section></main></section>`;AudioManager.syncUI();if(game.state==="QUESTION")startTimer();updateDebug();requestAnimationFrame(()=>LayoutDiagnostics.measure())}
function renderResult(){stopTimer();AudioManager.pauseAll();const sorted=[...game.teams].sort((a,b)=>b.score-a.score),winner=sorted[0],tie=sorted.filter(t=>t.score===winner.score).length>1;app.innerHTML=`<section class="result-screen"><article class="result-card">${ASSETS.trophy?`<img class="trophy" src="${ASSETS.trophy}" alt="Cúp chiến thắng">`:""}<div class="result-copy"><div class="question-label">HOÀN THÀNH BẢNG SỐ</div><h1>CHÚC MỪNG!</h1><div class="winner">${tie?"Các đội đồng hạng!":`${esc(winner.name)} chiến thắng`}</div><div class="result-scores">${sorted.map(t=>`<div class="result-score"><strong>${esc(t.name)}</strong><br>${t.score} điểm</div>`).join("")}</div><div class="result-actions"><button class="btn btn-primary" data-action="play-again">${icon("refresh")} CHƠI LẠI</button><button class="btn btn-soft" data-action="home">${icon("home")} MÀN CHÍNH TRÒ 19</button><button class="btn btn-secondary" data-action="library">TẤT CẢ CÁC TRÒ CHƠI</button><button class="btn btn-secondary" data-action="export">XUẤT CÂU HỎI</button></div></div></article></section>`;burst(innerWidth/2,innerHeight/2,innerWidth<620?12:22);updateDebug()}

function showSetup(step=1,mode=setupMode){setupStep=Math.max(1,Math.min(6,step));setupMode=mode;stopTimer();app.innerHTML=`<section class="setup-screen"><div class="wizard"><header class="wizard-head"><div class="wizard-title-row"><h1 class="wizard-title">THIẾT LẬP TRÒ CHƠI</h1><button class="icon-btn" data-action="home" aria-label="Đóng">${icon("close")}</button></div><div class="steps">${Array.from({length:6},(_,i)=>`<span class="step ${i+1<setupStep?"done":i+1===setupStep?"active":""}"></span>`).join("")}</div></header><main class="wizard-body">${setupContent()}</main><footer class="wizard-foot"><button class="btn btn-secondary" data-action="${setupStep===1?"home":"setup-back"}">${icon("back")} ${setupStep===1?"MÀN CHÍNH":"QUAY LẠI"}</button><button class="btn btn-primary" data-action="${setupStep===6?"start-now":"setup-next"}">${setupStep===6?`${icon("play")} BẮT ĐẦU`:`TIẾP THEO ${icon("next")}`}</button></footer></div></section>`;updateDebug()}
function setupContent(){if(setupStep===1)return questionStep();if(setupStep===2)return teamStep();if(setupStep===3)return boardStep();if(setupStep===4)return settingsStep();if(setupStep===5)return previewStep();return `<h2>Sẵn sàng bắt đầu!</h2><p class="lead">Hệ thống đã kiểm tra cấu hình. Nhấn BẮT ĐẦU để mở bảng số.</p><div class="preview-summary"><div class="summary-row"><span>Câu hỏi hợp lệ</span><strong>${config.questions.length}</strong></div><div class="summary-row"><span>Đội chơi</span><strong>${config.teamCount}</strong></div><div class="summary-row"><span>Bảng số</span><strong>${Math.min(config.boardSize,config.questions.length)} ô</strong></div><div class="summary-row"><span>Điểm mỗi câu</span><strong>${config.points}</strong></div></div>`}
function questionsToText(){return config.questions.map((q,i)=>`Câu ${i+1}: ${q.question}\nA. ${q.answers[0]}\nB. ${q.answers[1]}\nC. ${q.answers[2]}\nD. ${q.answers[3]}\nĐáp án: ${"ABCD"[q.correct]}\nGiải thích: ${q.explanation||""}`).join("\n\n")}
function questionStep(){const tools=`<h2>Bước 1 · Câu hỏi</h2><p class="lead">Nhập thủ công, dán nhanh, mở tệp TXT/CSV/JSON hoặc dùng bộ mẫu.</p><div class="question-tools"><button class="tool-card ${setupMode==="manual"?"active":""}" data-action="mode-manual">NHẬP THỦ CÔNG</button><button class="tool-card ${setupMode==="quick"?"active":""}" data-action="mode-quick">DÁN NHANH</button><button class="tool-card" data-action="import-file">NHẬP FILE</button><button class="tool-card" data-action="sample">BỘ MẪU</button></div>`;if(setupMode==="manual")return`${tools}<div class="manual-editor"><div class="field"><label>Nội dung câu hỏi</label><input id="manualQuestion" placeholder="Nhập nội dung câu hỏi"></div><div class="manual-answers">${["A","B","C","D"].map(k=>`<div class="field"><label>Đáp án ${k}</label><input id="manual${k}" placeholder="Lựa chọn ${k}"></div>`).join("")}</div><div class="manual-bottom"><div class="field"><label>Đáp án đúng</label><select id="manualCorrect">${["A","B","C","D"].map((k,i)=>`<option value="${i}">${k}</option>`).join("")}</select></div><div class="field"><label>Giải thích</label><input id="manualExplanation" placeholder="Giải thích ngắn (không bắt buộc)"></div><button class="btn btn-soft" data-action="manual-add">${icon("check")} THÊM CÂU</button></div><div class="manual-status"><strong>${config.questions.length}</strong> câu hiện có <button class="utility-btn" data-action="manual-clear">XÓA BỘ HIỆN TẠI</button></div></div>`;return`${tools}<div class="editor-grid"><div class="field-card"><label>Định dạng hỗ trợ</label><textarea readonly>Câu 1: Nội dung câu hỏi\nA. Lựa chọn A\nB. Lựa chọn B\nC. Lựa chọn C\nD. Lựa chọn D\nĐáp án: B\nGiải thích: ...</textarea></div><div class="field-card"><label>Nội dung câu hỏi · <span id="questionCount">${config.questions.length} câu hợp lệ</span></label><textarea id="questionInput" spellcheck="false">${esc(questionsToText())}</textarea><div id="validation" class="validation"></div></div></div>`}
function teamStep(){return `<h2>Bước 2 · Đội chơi</h2><p class="lead">Chọn từ 1–6 đội và đặt tên dễ nhận biết.</p><div class="form-grid"><div class="field"><label>Số đội</label><select id="teamCount">${Array.from({length:6},(_,i)=>`<option value="${i+1}" ${config.teamCount===i+1?"selected":""}>${i+1} đội</option>`).join("")}</select></div></div><div class="team-editor" style="margin-top:14px">${config.teams.map((t,i)=>`<div class="team-edit-card" style="display:${i<config.teamCount?"grid":"none"}"><span class="team-badge" style="--team:${t.color}">${i+1}</span><input data-team-name="${i}" value="${esc(t.name)}" maxlength="24" aria-label="Tên đội ${i+1}"></div>`).join("")}</div>`}
function boardStep(){return `<h2>Bước 3 · Bảng số</h2><p class="lead">Kích thước bảng tự cân hàng/cột để luôn vừa màn hình.</p><div class="form-grid"><div class="field"><label>Số ô</label><select id="boardSize">${[5,8,10,12,15,16,20,25].map(n=>`<option value="${n}" ${config.boardSize===n?"selected":""}>${n} ô · ${BoardLayoutManager.get(n).rows}×${BoardLayoutManager.get(n).cols}</option>`).join("")}</select></div><div class="field"><label>Trộn câu hỏi</label><select id="shuffle"><option value="1" ${config.shuffle?"selected":""}>Có · trộn một lần</option><option value="0" ${!config.shuffle?"selected":""}>Không</option></select></div></div><div class="preview-card" style="height:calc(100% - 100px);margin-top:14px"><div class="preview-board" style="${BoardLayoutManager.style(Math.min(config.boardSize,config.questions.length))}">${Array.from({length:Math.min(config.boardSize,config.questions.length)},(_,i)=>`<div class="preview-tile">${String(i+1).padStart(2,"0")}</div>`).join("")}</div></div>`}
function settingsStep(){return `<h2>Bước 4 · Cài đặt</h2><p class="lead">Điểm được đặt trước, không có nhân điểm hay hình phạt ngẫu nhiên.</p><div class="form-grid"><div class="field"><label>Điểm mỗi câu đúng</label><select id="points">${[5,10,20].map(n=>`<option value="${n}" ${config.points===n?"selected":""}>+${n} điểm</option>`).join("")}</select></div><div class="field"><label>Thời gian trả lời</label><select id="timer">${[[0,"Tắt"],[10,"10 giây"],[15,"15 giây"],[20,"20 giây"],[30,"30 giây"]].map(([v,l])=>`<option value="${v}" ${config.timer===v?"selected":""}>${l}</option>`).join("")}</select></div><div class="field"><label>Khi trả lời sai</label><select id="wrongMode"><option value="played" ${config.wrongMode==="played"?"selected":""}>Đánh dấu ô đã chơi</option><option value="closed" ${config.wrongMode==="closed"?"selected":""}>Giữ ô đóng</option></select></div><div class="field"><label>Ô Lucky Number</label><select id="lucky"><option value="0" ${!config.lucky?"selected":""}>Tắt · mặc định</option><option value="1" ${config.lucky?"selected":""}>Bật · chỉ thêm huy hiệu</option></select></div></div>`}
function previewStep(){const count=Math.min(config.boardSize,config.questions.length);return `<h2>Bước 5 · Xem trước</h2><p class="lead">Kiểm tra nhanh bảng số và cấu hình trước khi bắt đầu.</p><div class="preview-grid step-five-grid"><div class="preview-card preview-board-card"><strong>Bảng ${count} ô</strong><div class="preview-board preview-board-fit" style="${BoardLayoutManager.style(count)}">${Array.from({length:count},(_,i)=>`<div class="preview-tile">${String(i+1).padStart(2,"0")}</div>`).join("")}</div></div><div class="preview-card preview-summary"><div class="summary-row"><span>Câu hỏi</span><strong>${config.questions.length}</strong></div><div class="summary-row"><span>Đội chơi</span><strong>${config.teamCount}</strong></div><div class="summary-row"><span>Điểm/câu</span><strong>${config.points}</strong></div><div class="summary-row"><span>Đồng hồ</span><strong>${config.timer?`${config.timer} giây`:"Tắt"}</strong></div><div class="summary-row"><span>Lucky Number</span><strong>${config.lucky?"Bật":"Tắt"}</strong></div></div></div>`}

function parseQuestions(text){const blocks=String(text).replace(/\r/g,"").trim().split(/\n\s*\n+/),out=[],errors=[];blocks.forEach((block,bi)=>{const lines=block.split("\n").map(s=>s.trim()).filter(Boolean);if(!lines.length)return;const qLine=lines.find(x=>/^(câu\s*\d+\s*[:.)-]|question\s*\d*\s*:)/i.test(x))||lines[0],question=qLine.replace(/^(câu\s*\d+\s*[:.)-]|question\s*\d*\s*:)/i,"").trim();const answers=["A","B","C","D"].map(k=>{const l=lines.find(x=>new RegExp(`^${k}[\\.\\):]\\s*`,"i").test(x));return l?l.replace(new RegExp(`^${k}[\\.\\):]\\s*`,"i"),"").trim():""});const ansLine=lines.find(x=>/^(đáp\s*án|dap\s*an|answer)\s*:/i.test(x));const expLine=lines.find(x=>/^(giải\s*thích|giai\s*thich|explanation)\s*:/i.test(x));const letter=ansLine?(ansLine.split(":").slice(1).join(":").trim().match(/[ABCD]/i)||[])[0]:null;if(!question)errors.push(`Câu ${bi+1} thiếu nội dung.`);answers.forEach((a,i)=>{if(!a)errors.push(`Câu ${bi+1} thiếu đáp án ${"ABCD"[i]}.`)});if(!letter)errors.push(`Câu ${bi+1} thiếu đáp án đúng.`);if(question&&answers.every(Boolean)&&letter)out.push({id:bi+1,question,answers,correct:"ABCD".indexOf(letter.toUpperCase()),explanation:expLine?expLine.replace(/^[^:]+:/,"").trim():""})});return{questions:out,errors}}
function parseCSV(text){const rows=String(text).replace(/\r/g,"").split("\n").filter(Boolean).map(line=>{const cells=[];let cur="",quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){cur+='"';i++}else if(c==='"')quote=!quote;else if(c===","&&!quote){cells.push(cur.trim());cur=""}else cur+=c}cells.push(cur.trim());return cells});if(rows[0]&&/question|câu hỏi/i.test(rows[0][0]))rows.shift();const errors=[],questions=[];rows.forEach((r,i)=>{if(r.length<6){errors.push(`Dòng ${i+1} cần ít nhất 6 cột.`);return}const letter=String(r[5]).trim().toUpperCase(),correct=/^[ABCD]$/.test(letter)?"ABCD".indexOf(letter):Number(letter);if(!Number.isInteger(correct)||correct<0||correct>3){errors.push(`Dòng ${i+1} có đáp án đúng không hợp lệ.`);return}questions.push({id:i+1,question:r[0],answers:r.slice(1,5),correct,explanation:r[6]||""})});return{questions,errors}}
function parseJSON(text){try{const raw=JSON.parse(text),arr=Array.isArray(raw)?raw:raw.questions;if(!Array.isArray(arr))return{questions:[],errors:["JSON phải là một mảng câu hỏi."]};const errors=[],questions=[];arr.forEach((q,i)=>{const answers=q.answers||[q.A,q.B,q.C,q.D],c=typeof q.correct==="number"?q.correct:"ABCD".indexOf(String(q.correct||q.answer||"").toUpperCase());if(!q.question)errors.push(`Câu ${i+1} thiếu nội dung.`);else if(!Array.isArray(answers)||answers.length!==4||answers.some(x=>!String(x||"").trim()))errors.push(`Câu ${i+1} phải có đủ 4 đáp án.`);else if(c<0||c>3)errors.push(`Câu ${i+1} thiếu đáp án đúng.`);else questions.push({id:i+1,question:String(q.question),answers:answers.map(String),correct:c,explanation:String(q.explanation||"")})});return{questions,errors}}catch(e){return{questions:[],errors:[`JSON không hợp lệ: ${e.message}`]}}}
function applyQuestionText(){const input=qs("#questionInput");if(!input)return true;const parsed=parseQuestions(input.value),validation=qs("#validation");if(parsed.errors.length){validation.textContent=parsed.errors[0];return false}if(!parsed.questions.length){validation.textContent="Chưa tìm thấy câu hỏi hợp lệ.";return false}config.questions=parsed.questions;config.boardSize=[5,8,10,12,15,16,20,25].filter(n=>n<=parsed.questions.length).pop()||parsed.questions.length;saveConfig();return true}
function collectSetup(){if(setupStep===1){if(setupMode==="manual"&&!config.questions.length){toast("Vui lòng thêm ít nhất một câu hỏi.");return false}return applyQuestionText()}if(setupStep===2){config.teamCount=Number(qs("#teamCount").value);qsa("[data-team-name]").forEach(el=>config.teams[Number(el.dataset.teamName)].name=el.value.trim()||`ĐỘI ${Number(el.dataset.teamName)+1}`)}if(setupStep===3){config.boardSize=Number(qs("#boardSize").value);config.shuffle=qs("#shuffle").value==="1"}if(setupStep===4){config.points=Number(qs("#points").value);config.timer=Number(qs("#timer").value);config.wrongMode=qs("#wrongMode").value;config.lucky=qs("#lucky").value==="1"}saveConfig();return true}
function addManualQuestion(){const question=qs("#manualQuestion")?.value.trim(),answers=["A","B","C","D"].map(k=>qs(`#manual${k}`)?.value.trim());if(!question){toast("Vui lòng nhập nội dung câu hỏi.");return}const missing=answers.findIndex(x=>!x);if(missing>=0){toast(`Câu mới thiếu đáp án ${"ABCD"[missing]}.`);return}config.questions.push({id:Math.max(0,...config.questions.map(q=>Number(q.id)||0))+1,question,answers,correct:Number(qs("#manualCorrect").value),explanation:qs("#manualExplanation")?.value.trim()||""});saveConfig();showSetup(1,"manual");toast("Đã thêm câu hỏi mới.")}

function selectTile(index){if(!game||game.state!=="BOARD_PICK"||game.tileStates[index]!=="normal")return;game.state="QUESTION";game.currentTile=index;game.selectedAnswer=null;game.answeredCorrect=null;game.timeLeft=game.settings.timer||null;saveGame();renderGame();AudioManager.init()}
function answer(index,timeout=false){if(!game||game.state!=="QUESTION")return;stopTimer();const q=currentQuestion();if(!q)return;game.state="ANSWER_LOCKED";game.selectedAnswer=index;const correct=index===q.correct;game.answeredCorrect=correct;if(correct){game.teams[game.currentTeam].score+=game.settings.points;game.tileStates[game.currentTile]="done";game.state="CORRECT"}else{game.tileStates[game.currentTile]=game.settings.wrongMode==="played"?"done":"normal";game.state="WRONG"}saveGame();renderGame();AudioManager.feedback(correct);if(correct)burst(innerWidth*.72,innerHeight*.56,innerWidth<620?5:9);if(timeout)toast("Hết giờ! Đáp án đúng đã được hiển thị.")}
function nextTurn(){if(!game)return;if(game.tileStates.every(x=>x==="done")){game.state="COMPLETED";saveGame();renderResult();return}game.currentTeam=(game.currentTeam+1)%game.teams.length;game.currentTile=null;game.selectedAnswer=null;game.answeredCorrect=null;game.timeLeft=game.settings.timer||null;game.state="BOARD_PICK";saveGame();renderGame()}
function skipTurn(){if(!game)return;if(game.state==="QUESTION")game.tileStates[game.currentTile]="normal";game.currentTeam=(game.currentTeam+1)%game.teams.length;game.currentTile=null;game.selectedAnswer=null;game.answeredCorrect=null;game.state="BOARD_PICK";stopTimer();saveGame();renderGame()}
function startTimer(){stopTimer();if(!game.settings.timer||game.timeLeft===null)return;timerId=setInterval(()=>{if(!game||game.state!=="QUESTION")return stopTimer();game.timeLeft=Math.max(0,game.timeLeft-1);const e=qs("#timerValue");if(e)e.textContent=`${game.timeLeft}s`;if(game.timeLeft<=0){stopTimer();answer(-1,true)}saveGame()},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

function showHelp(){const items=["Nhập câu hỏi thủ công, dán nhanh hoặc mở tệp TXT/CSV/JSON.","Chia từ 1–6 đội và đặt tên riêng.","Đội đang đến lượt chọn một ô số còn đóng.","Mỗi ô mở ra một câu hỏi với 4 đáp án A–B–C–D.","Trả lời đúng nhận số điểm đã cài đặt trước.","Nhấn Tiếp tục để chuyển sang đội kế tiếp.","Mở hết bảng để hoàn thành và xem kết quả.","Điều chỉnh âm lượng hoặc tắt âm ở thanh trên.","Dùng nút toàn màn hình khi trình chiếu.","Nút Tất cả các trò chơi mới đưa về index.html."];modalRoot.innerHTML=`<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><header class="dialog-head"><h2 id="helpTitle">HƯỚNG DẪN</h2><button class="icon-btn" data-action="close-modal">${icon("close")}</button></header><div class="dialog-body"><div class="help-grid">${items.map((x,i)=>`<div class="help-item"><span class="help-num">${i+1}</span><span>${x}</span></div>`).join("")}</div></div><footer class="dialog-foot"><button class="btn btn-primary" data-action="close-modal">ĐÃ HIỂU</button></footer></section></div>`}
function pauseGame(){if(!game||["HOME","SETUP","COMPLETED","PAUSED"].includes(game.state))return;previousState=game.state;game.state="PAUSED";stopTimer();AudioManager.pauseAll();saveGame();modalRoot.innerHTML=`<div class="dialog-backdrop"><section class="dialog" style="max-width:520px"><header class="dialog-head"><h2>TRÒ CHƠI ĐANG TẠM DỪNG</h2></header><div class="dialog-body"><p>Tiến trình đã được lưu. Tiếp tục khi lớp học sẵn sàng.</p></div><footer class="dialog-foot"><button class="btn btn-primary" data-action="resume">${icon("play")} TIẾP TỤC</button></footer></section></div>`}
function resumeGame(){if(!game)return;if(game.state==="PAUSED")game.state=previousState||"BOARD_PICK";modalRoot.innerHTML="";saveGame();renderGame();AudioManager.playBg(true)}
function resetGame(){localStorage.removeItem(STORAGE_KEY);game=null;renderHome()}
function goHome(){stopTimer();AudioManager.pauseAll();modalRoot.innerHTML="";renderHome()}
function goToLibrary(){window.location.href="index.html"}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
function toast(msg){const e=qs("#toast");e.textContent=msg;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)}
function burst(x,y,count=8){if(document.hidden)return;for(let i=0;i<count;i++){const s=document.createElement("i");s.className="spark";s.style.left=`${x}px`;s.style.top=`${y}px`;s.style.background=["#ffd05a","#5cd6ba","#6274f5","#ff7b7e"][i%4];s.style.setProperty("--dx",`${(Math.random()-.5)*180}px`);s.style.setProperty("--dy",`${-40-Math.random()*150}px`);document.body.appendChild(s);setTimeout(()=>s.remove(),800)}}
function checkOverflow(sel){const e=qs(sel);return e?{x:e.scrollWidth<=e.clientWidth+1,y:e.scrollHeight<=e.clientHeight+2}:null}
let errors=[];function recordError(e){errors.push(String(e?.message||e));if(errors.length>20)errors.shift();updateDebug()}
window.addEventListener("error",e=>recordError(e.error||e.message));window.addEventListener("unhandledrejection",e=>recordError(e.reason));document.addEventListener("visibilitychange",()=>{if(document.hidden)stopTimer();else if(game?.state==="QUESTION")startTimer()});

function exportQuestions(){const blob=new Blob([questionsToText()],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cau-hoi-lucky-number.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importQuestions(){fileInput.click()}
fileInput.addEventListener("change",async()=>{const file=fileInput.files?.[0];if(!file)return;try{const text=await file.text(),ext=file.name.split(".").pop().toLowerCase(),parsed=ext==="json"?parseJSON(text):ext==="csv"?parseCSV(text):parseQuestions(text);if(parsed.errors.length||!parsed.questions.length){toast(parsed.errors[0]||"Tệp không có câu hỏi hợp lệ.");return}config.questions=parsed.questions;config.boardSize=[5,8,10,12,15,16,20,25].filter(n=>n<=parsed.questions.length).pop()||parsed.questions.length;saveConfig();toast(`Đã nhập ${parsed.questions.length} câu hỏi.`);showSetup(1,"quick")}catch(e){toast(`Không thể đọc tệp: ${e.message}`)}finally{fileInput.value=""}});

document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b||b.disabled)return;AudioManager.init();const a=b.dataset.action,n=Number(b.dataset.index);if(a==="quick-start")showSetup(5);else if(a==="setup-questions")showSetup(1,"manual");else if(a==="setup-paste")showSetup(1,"quick");else if(a==="setup-settings")showSetup(4);else if(a==="import-file")importQuestions();else if(a==="continue"){if(game){if(game.state==="PAUSED")game.state="BOARD_PICK";renderGame();AudioManager.playBg(true)}}else if(a==="help")showHelp();else if(a==="close-modal")modalRoot.innerHTML="";else if(a==="library")goToLibrary();else if(a==="home")goHome();else if(a==="fullscreen")toggleFullscreen();else if(a==="mute")AudioManager.toggleSound();else if(a==="volume-down")AudioManager.setVolume(config.volume-.1);else if(a==="volume-up")AudioManager.setVolume(config.volume+.1);else if(a==="pause")pauseGame();else if(a==="resume")resumeGame();else if(a==="tile")selectTile(n);else if(a==="answer")answer(n);else if(a==="next-turn")nextTurn();else if(a==="skip-turn")skipTurn();else if(a==="setup-back"){collectSetup();showSetup(setupStep-1)}else if(a==="setup-next"){if(collectSetup())showSetup(setupStep+1)}else if(a==="start-now"){collectSetup();newGame()}else if(a==="mode-manual")showSetup(1,"manual");else if(a==="mode-quick")showSetup(1,"quick");else if(a==="manual-add")addManualQuestion();else if(a==="manual-clear"){config.questions=[];saveConfig();showSetup(1,"manual");toast("Đã xóa bộ câu hỏi hiện tại.")}else if(a==="sample"){config.questions=deepClone(SAMPLE_QUESTIONS);saveConfig();showSetup(1,setupMode);toast("Đã nạp bộ 20 câu hỏi mẫu.")}else if(a==="play-again")newGame();else if(a==="export")exportQuestions()});
document.addEventListener("change",e=>{if(e.target.id==="teamCount"){config.teamCount=Number(e.target.value);saveConfig();showSetup(2)}if(e.target.id==="boardSize"){config.boardSize=Number(e.target.value);saveConfig();showSetup(3)}});

function updateVolumeUI(){qsa(".volume-value").forEach(e=>e.textContent=`${Math.round(config.volume*100)}%`);AudioManager.syncUI()}
function runSelfTests(){
  const tests=[];
  const add=(name,pass,detail="")=>tests.push({name,pass:!!pass,detail});
  add("Tên file cố định",GAME_METADATA.fileName==="19. Lucky Number - ô số bí mật.html");
  add("Metadata trò 19",GAME_METADATA.id===19&&GAME_METADATA.offline);
  add("Không có mojibake",!/[\u00c3\u00c6]|\u00e1\u00ba|\u00e1\u00bb/.test(document.body.innerText));
  add("Không tràn ngang body",document.documentElement.scrollWidth<=document.documentElement.clientWidth+1,`${document.documentElement.scrollWidth}/${document.documentElement.clientWidth}`);
  add("Không tràn dọc gameplay",!qs(".game-main")||document.documentElement.scrollHeight<=document.documentElement.clientHeight+2,`${document.documentElement.scrollHeight}/${document.documentElement.clientHeight}`);
  add("Điểm cố định hợp lệ",[5,10,20].includes(config.points));
  add("Số đội 1–6",config.teamCount>=1&&config.teamCount<=6);
  add("Câu hỏi đủ A–B–C–D",config.questions.every(q=>q.answers.length===4&&q.correct>=0&&q.correct<4));
  add("Đủ 8 tên audio",[...AudioManager.bgNames,...AudioManager.correctNames,...AudioManager.wrongNames].length===8);
  add("Điều hướng kho đúng",goToLibrary.toString().includes('"index.html"'));
  add("API toàn cục",["startGame","pauseGame","resumeGame","resetGame","goHome","goToLibrary","exportQuestions","importQuestions","runSelfTests","getGameMetadata"].every(k=>typeof window[k]==="function"));
  const tile=qs(".number-tile");
  if(tile){const r=tile.getBoundingClientRect(),cs=getComputedStyle(tile);add("Số trong tile căn giữa",cs.display==="grid"&&cs.placeItems==="center",`${Math.round(r.width)}×${Math.round(r.height)}`)}
  const answerEl=qs(".answer-card");
  if(answerEl)add("Cỡ chữ đáp án đạt tối thiểu",parseFloat(getComputedStyle(answerEl).fontSize)>=(innerWidth<=620?17:19),getComputedStyle(answerEl).fontSize);
  const qEl=qs(".question-text");
  if(qEl)add("Cỡ chữ câu hỏi đạt tối thiểu",parseFloat(getComputedStyle(qEl).fontSize)>=(innerWidth<=620?20:26),getComputedStyle(qEl).fontSize);
  return{passed:tests.filter(t=>t.pass).length,failed:tests.filter(t=>!t.pass).length,tests}
}
function getGameMetadata(){return deepClone(GAME_METADATA)}
function updateDebug(){const d=qs("#debugPanel");if(!new URLSearchParams(location.search).has("debug")){d.hidden=true;return}d.hidden=false;const m=LayoutDiagnostics.measure(),t=runSelfTests(),failed=t.tests.filter(x=>!x.pass).map(x=>`${x.name}${x.detail?` (${x.detail})`:""}`).join(" | ")||"none";d.textContent=`GAME 19 DEBUG\nviewport: ${m.viewport}\noverflow: ${m.scroll}\nstate: ${game?.state||"HOME"}\nteam: ${game?game.currentTeam+1:"-"}\nboard: ${game?game.tileStates.length:"-"}\ntimer: ${game?.timeLeft??"-"}\naudio: ${config.muted?"muted":Math.round(config.volume*100)+"%"}\nstorage: ${game?"session":"empty"}\nself-tests: ${t.passed} pass / ${t.failed} fail\nfailed: ${failed}\nerrors: ${errors.join(" | ")||"none"}\nlayout: ${JSON.stringify(m.rects)}`}

window.startGame=newGame;window.pauseGame=pauseGame;window.resumeGame=resumeGame;window.resetGame=resetGame;window.goHome=goHome;window.goToLibrary=goToLibrary;window.exportQuestions=exportQuestions;window.importQuestions=importQuestions;window.runSelfTests=runSelfTests;window.getGameMetadata=getGameMetadata;window.BoardLayoutManager=BoardLayoutManager;window.ResponsiveManager=ResponsiveManager;window.LayoutDiagnostics=LayoutDiagnostics;
renderHome();
</script>
