<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F4FAFF">
  <meta name="description" content="Triệu phú tri thức – trò chơi trắc nghiệm 15 bậc dành cho lớp học.">
  <title>Triệu phú tri thức</title>
  <style>:root {
  --navy:#17364b; --navy-2:#234f69; --sky:#5ebbff; --blue:#3d91ec;
  --mint:#55d9c6; --indigo:#6579f6; --gold:#ffd369; --amber:#f7b94a;
  --coral:#ff7f78; --ice:#f4faff; --pale:#e7f5ff; --white:#fff;
  --shadow:0 18px 42px rgba(31,79,116,.16); --soft:0 8px 20px rgba(31,79,116,.12);
  --radius:24px; --header:68px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--navy);background:var(--ice);font-weight:650;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:4px solid rgba(61,145,236,.28);outline-offset:2px}
button:disabled{cursor:not-allowed}
.app-shell{width:100%;height:100dvh;overflow:hidden;background-color:var(--ice);background-image:linear-gradient(rgba(244,250,255,.72),rgba(244,250,255,.72)),var(--stage);background-size:cover;background-position:center}
.screen{height:100dvh;overflow:hidden;position:relative}
.svg-icon{width:22px;height:22px;display:block;flex:0 0 auto}
.topbar{height:var(--header);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:8px 22px;background:rgba(255,255,255,.96);border-bottom:2px solid rgba(94,187,255,.2);box-shadow:0 5px 18px rgba(31,79,116,.1);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--sky),var(--indigo));box-shadow:0 6px 0 #4558bc}
.brand-name{font-size:clamp(18px,1.45vw,24px);font-weight:950;white-space:nowrap;letter-spacing:-.02em}
.top-center{display:flex;align-items:center;gap:8px}
.pill{height:44px;padding:0 15px;border-radius:999px;display:flex;align-items:center;gap:7px;white-space:nowrap;background:#fff;border:2px solid rgba(101,121,246,.18);box-shadow:0 4px 0 rgba(101,121,246,.1);font-size:16px;font-weight:850}
.pill strong{font-weight:950}
.top-actions{display:flex;justify-content:flex-end;align-items:center;gap:7px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid rgba(23,54,75,.14);box-shadow:0 4px 0 rgba(23,54,75,.08);transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.icon-btn:hover:not(:disabled){transform:translateY(-1px)}
.icon-btn.sound-on{color:#14765f;background:#e9fff8;border-color:#55d9c6;box-shadow:0 4px 0 rgba(36,139,117,.22),0 0 0 4px rgba(85,217,198,.13)}
.icon-btn.sound-off{color:#a84d59;background:#fff0f1;border-color:#ffb0ad}
.volume-wrap{display:flex;align-items:center;gap:5px}
.volume-wrap input{width:76px;accent-color:var(--indigo)}
.volume-value{min-width:44px;text-align:center;font-size:14px;font-weight:900}

/* HOME */
.home-main{height:calc(100dvh - var(--header));display:grid;grid-template-columns:minmax(0,48fr) minmax(0,52fr);gap:clamp(18px,2.8vw,48px);align-items:center;padding:clamp(16px,2.4vw,40px)}
.hero-copy{max-width:700px;width:100%;justify-self:end;display:flex;flex-direction:column;justify-content:center;gap:clamp(11px,1.55vh,20px);min-height:0}
.eyebrow{align-self:flex-start;height:38px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.94);border:1px solid rgba(94,187,255,.35);box-shadow:var(--soft);font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#2d70a5}
.eyebrow-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(255,211,105,.2)}
.hero-title{margin:0;font-size:clamp(43px,4.2vw,68px);line-height:.94;letter-spacing:-.045em;font-weight:950}
.hero-title span{display:block}
.hero-title .millionaire{color:transparent;background:linear-gradient(90deg,#2c8ee7,#6579f6 58%,#8667dd);-webkit-background-clip:text;background-clip:text}
.hero-title .knowledge{color:var(--navy);margin-top:7px}
.tagline{margin:0;max-width:660px;font-size:clamp(16px,1.25vw,21px);line-height:1.4;font-weight:800;color:#456b83}
.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;max-width:640px}
.btn{min-height:52px;border-radius:16px;padding:0 17px;display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;font-size:17px;font-weight:920;letter-spacing:.01em;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:saturate(1.06)}
.btn-primary{grid-column:1/-1;min-height:62px;color:#fff;background:linear-gradient(115deg,#328fe8,#6579f6 54%,#8668dc);box-shadow:0 8px 0 #4558bc,0 17px 28px rgba(77,95,203,.25)}
.btn-secondary{background:#fff;border:2px solid rgba(94,187,255,.27);box-shadow:0 5px 0 rgba(61,145,236,.13)}
.btn-soft{background:linear-gradient(135deg,#ecfff9,#e9f6ff);border:2px solid rgba(85,217,198,.35);box-shadow:0 5px 0 rgba(44,156,135,.17)}
.hero-utils{max-width:640px;display:grid;grid-template-columns:1fr 1fr 1.28fr;gap:9px}
.utility-btn{height:44px;border-radius:14px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;background:rgba(255,255,255,.88);border:1px solid rgba(23,54,75,.15);font-size:13px;font-weight:850}
.utility-btn:disabled{opacity:.42}
.hero-visual{height:min(79vh,760px);width:100%;max-width:920px;justify-self:start;position:relative;display:grid;place-items:center;overflow:hidden;border-radius:38px}
.tower-art{position:absolute;inset:-2% -4% -2% -4%;width:108%;height:104%;object-fit:contain;filter:drop-shadow(0 24px 28px rgba(31,79,116,.22))}
.hero-orbit{position:absolute;width:min(64%,590px);aspect-ratio:1;border:2px solid rgba(255,211,105,.6);border-radius:50%;box-shadow:0 0 34px rgba(255,211,105,.24);pointer-events:none}
.hero-chip{position:absolute;border-radius:16px;padding:9px 14px;background:#fff;border:2px solid rgba(94,187,255,.2);box-shadow:var(--soft);font-size:13px;font-weight:900}
.hero-chip.one{left:4%;top:15%;color:#356fa5}.hero-chip.two{right:3%;bottom:14%;color:#2e816f}
.academic-dots{position:absolute;inset:7%;pointer-events:none}
.academic-dot{position:absolute;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#357aae;background:rgba(255,255,255,.9);box-shadow:var(--soft)}
.academic-dot:nth-child(1){left:2%;bottom:28%}.academic-dot:nth-child(2){right:5%;top:24%}.academic-dot:nth-child(3){right:8%;bottom:29%}

/* SETUP */
.setup-screen{height:100dvh;padding:14px;display:grid;place-items:center;background:linear-gradient(135deg,#eef9ff,#f2f0ff)}
.wizard{width:min(1180px,100%);height:min(760px,calc(100dvh - 28px));display:grid;grid-template-rows:auto 1fr auto;background:rgba(255,255,255,.97);border-radius:28px;overflow:hidden;box-shadow:0 28px 72px rgba(31,79,116,.22)}
.wizard-head{padding:16px 22px 12px;border-bottom:1px solid #dceaf4}
.wizard-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.wizard-title{margin:0;font-size:26px;font-weight:950}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.step{height:8px;border-radius:99px;background:#dce8f1}.step.active,.step.done{background:linear-gradient(90deg,var(--sky),var(--indigo))}
.wizard-body{min-height:0;padding:16px 22px;overflow:hidden}
.wizard-body h2{font-size:clamp(24px,2.1vw,34px);margin:0 0 5px}.wizard-body>.lead{margin:0 0 12px;color:#58778b;font-weight:650}
.wizard-foot{padding:12px 22px 16px;border-top:1px solid #dceaf4;display:flex;justify-content:space-between;gap:12px}
.wizard-foot .btn{min-width:150px}
.question-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:9px}
.tool-card{height:46px;border-radius:14px;background:#eff8ff;border:2px solid #d5eafa;font-size:13px;font-weight:900}.tool-card.active{background:#e9eaff;border-color:var(--indigo)}
.editor-grid{height:calc(100% - 108px);display:grid;grid-template-columns:1fr 1.22fr;gap:12px}
.field-card{min-height:0;padding:12px;border-radius:18px;background:#f7fbff;border:1px solid #d7e8f3;display:flex;flex-direction:column}
.field-card label{font-size:13px;font-weight:850;margin-bottom:7px}.field-card textarea{flex:1;min-height:0;resize:none;border:2px solid #dcebf5;border-radius:14px;background:#fff;padding:10px;font-size:14px;line-height:1.42}
.validation{min-height:19px;font-size:12px;margin-top:6px;color:#d1525b}.validation.good{color:#2c927b}
.manual-editor{height:calc(100% - 108px);display:grid;grid-template-rows:auto auto auto 1fr;gap:9px;padding:12px;border:1px solid #d5e7f3;border-radius:18px;background:#f7fbff}
.manual-answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.manual-bottom{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:8px;align-items:end}.manual-status{align-self:end;display:flex;align-items:center;gap:8px;color:#58768c}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:850;color:#4e6b80}.field input,.field select{height:46px;border-radius:13px;border:2px solid #dcebf5;background:#fff;padding:0 12px}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.setting-card{padding:13px;border-radius:17px;background:#f5faff;border:1px solid #dcecf6}
.preview-grid{height:calc(100% - 72px);display:grid;grid-template-columns:44fr 56fr;gap:14px}.preview-card{min-height:0;border-radius:20px;background:#f5faff;border:1px solid #dcecf6;padding:14px}.preview-tower{display:grid;grid-template-columns:repeat(var(--count),1fr);align-items:end;gap:4px;height:calc(100% - 28px);margin-top:8px}.preview-step{min-width:0;border-radius:8px 8px 4px 4px;background:linear-gradient(#fff,#dcefff);border:1px solid #acd7f1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:11px;font-weight:900}.preview-step.milestone{background:linear-gradient(#fff8d5,#ffe58a);border-color:#efc04f}.preview-summary{display:grid;gap:10px;align-content:center}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:14px;background:#fff}.ready-panel{height:calc(100% - 65px);display:grid;grid-template-columns:1fr minmax(220px,38%);align-items:center;gap:22px}.ready-art{width:100%;height:100%;object-fit:contain}

/* GAME */
.game-main{height:calc(100dvh - var(--header));padding:14px clamp(12px,1.45vw,24px) 16px;display:grid;grid-template-columns:minmax(305px,30fr) minmax(0,70fr);gap:14px}
.progress-zone,.question-zone{min-width:0;min-height:0}
.progress-zone{display:grid;grid-template-rows:1fr auto;gap:10px}
.tower-panel{min-height:0;border-radius:var(--radius);padding:13px;background:linear-gradient(150deg,rgba(255,255,255,.97),rgba(226,245,255,.96));border:2px solid rgba(255,255,255,.98);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.tower-panel::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(255,211,105,.23),transparent 26%),radial-gradient(circle at 20% 90%,rgba(85,217,198,.18),transparent 26%);pointer-events:none}
.panel-title{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:clamp(16px,1.2vw,20px);font-weight:950}
.tower-badge{padding:5px 9px;border-radius:999px;background:#fff;border:1px solid #cce3f2;font-size:12px;color:#527187}
.level-list{position:relative;z-index:1;flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--levels),minmax(0,1fr));gap:3px}
.level-row{min-height:0;border-radius:10px;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:7px;padding:0 9px;background:rgba(255,255,255,.86);border:1px solid rgba(47,120,169,.13);font-size:clamp(12px,.9vw,15px);transition:.4s ease}
.level-number{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:#e9f5fd;color:#3d7dab;font-weight:950}
.level-points{font-weight:900}.level-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6b8799}
.level-row.current{color:#fff;background:linear-gradient(105deg,#358fe5,#6579f6);border-color:#fff;box-shadow:0 4px 0 #4356b8,0 0 0 3px rgba(101,121,246,.14);transform:translateX(3px)}
.level-row.current .level-number{background:#fff;color:#5268d5}.level-row.current .level-label{color:#eef2ff}
.level-row.completed{background:linear-gradient(105deg,#e8fff7,#c6f5e8);border-color:#55d9c6}.level-row.completed .level-number{background:#38b99f;color:#fff}
.level-row.wrong-level{background:#fff2f1;border-color:#ffb3af}.level-row.wrong-level .level-number{background:#ff7f78;color:#fff}
.level-row.milestone:not(.current):not(.completed){background:linear-gradient(105deg,#fffbee,#fff0b6);border-color:#efd071}.level-row.milestone .level-points::after{content:" ◆";color:#e7a91e}
.progress-foot{height:52px;display:grid;grid-template-columns:1fr auto;gap:8px}.score-card{border-radius:15px;background:rgba(255,255,255,.94);border:1px solid rgba(23,54,75,.13);padding:0 13px;display:flex;align-items:center;justify-content:space-between;gap:8px}.score-card span{font-size:12px;color:#638095}.score-card strong{font-size:20px;color:#2f7fac}
.question-zone{display:grid;grid-template-rows:auto 1fr auto auto;gap:10px}
.question-card{min-height:128px;border-radius:var(--radius);padding:16px clamp(18px,2.3vw,34px);background:rgba(255,255,255,.97);border:2px solid rgba(255,211,105,.55);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.question-card::after{content:"";position:absolute;width:150px;height:150px;right:-45px;top:-55px;border:2px solid rgba(94,187,255,.13);border-radius:50%}
.question-kicker{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#5c76a1;margin-bottom:7px}
.question-text{max-width:980px;font-size:clamp(26px,2.25vw,39px);line-height:1.2;font-weight:950;overflow-wrap:anywhere}
.question-text.long{font-size:clamp(26px,1.9vw,32px);line-height:1.26;text-align:left;width:100%}
.answer-grid{min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.answer-card{min-height:72px;border-radius:21px;padding:14px 17px;display:grid;grid-template-columns:50px 1fr 26px;align-items:center;gap:13px;text-align:left;background:rgba(255,255,255,.97);border:2px solid rgba(23,54,75,.12);box-shadow:0 7px 0 rgba(23,54,75,.11);font-size:clamp(19px,1.55vw,26px);line-height:1.28;font-weight:830;transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease}
.answer-card:hover:not(:disabled){transform:translateY(-2px);border-color:var(--sky)}
.answer-card.selected{transform:scale(1.01);background:#edf7ff;border-color:#459ce8;box-shadow:0 7px 0 #3980b9,0 0 0 4px rgba(94,187,255,.13)}
.answer-card.correct{background:#e5fff5;border-color:#38bd9f;box-shadow:0 7px 0 #2e987f}.answer-card.wrong{background:#fff0ef;border-color:var(--coral);box-shadow:0 7px 0 #d65c58}
.answer-card.hidden-option{opacity:.16;visibility:hidden;pointer-events:none}
.answer-badge{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#e9f6ff;color:#2d7fbd;font-size:23px;font-weight:950;line-height:1}
.answer-card:nth-child(2) .answer-badge{background:#e9fff8;color:#238b75}.answer-card:nth-child(3) .answer-badge{background:#f2edff;color:#7d55d5}.answer-card:nth-child(4) .answer-badge{background:#fff1ef;color:#d95d58}
.answer-card.correct .answer-badge{background:#38bd9f;color:#fff}.answer-card.wrong .answer-badge{background:var(--coral);color:#fff}.answer-mark{font-size:23px;font-weight:950}
.answer-grid.answers-long{grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:7px}.answers-long .answer-card{padding-block:8px}
.lifeline-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lifeline{height:54px;border-radius:16px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#effff9,#ecf7ff);border:2px solid rgba(85,217,198,.28);box-shadow:0 4px 0 rgba(44,156,135,.14);font-size:13px;font-weight:900;text-align:center}.lifeline:disabled{opacity:.45;filter:grayscale(.35)}.lifeline.used{background:#edf0f2;border-color:#d5e0e7;box-shadow:none}
.feedback-bar{min-height:66px;border-radius:19px;padding:9px 11px 9px 17px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:11px;background:rgba(255,255,255,.97);border:2px solid rgba(23,54,75,.12);box-shadow:var(--soft)}
.feedback-bar.good{border-color:#45c9aa}.feedback-bar.bad{border-color:var(--coral)}.feedback-bar.safe{border-color:#efc24f;background:#fffaf0}
.feedback-title{font-size:19px;font-weight:950}.feedback-detail{font-size:13px;color:#45677f;margin-top:2px}
.feedback-next{min-width:145px;height:47px;border-radius:14px;background:linear-gradient(135deg,#46c8aa,#38a88f);color:#fff;font-size:16px;font-weight:950;box-shadow:0 5px 0 #287d6b}
.empty-question{grid-row:1/-1;border-radius:var(--radius);padding:clamp(22px,3.5vw,54px);display:grid;grid-template-columns:1fr minmax(180px,31%);align-items:center;gap:20px;background:rgba(255,255,255,.94);border:2px solid rgba(255,255,255,.98);box-shadow:var(--shadow)}
.empty-copy h2{font-size:clamp(30px,3vw,48px);line-height:1.1;margin:0 0 10px}.empty-copy p{font-size:clamp(17px,1.4vw,22px);line-height:1.45;color:#4f7085;margin:0}.empty-art{width:100%;max-height:360px;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(31,79,116,.18))}
.mobile-progress{display:none}

/* RESULT + DIALOG */
.result-screen{height:100dvh;display:grid;place-items:center;padding:16px;background-image:linear-gradient(rgba(244,250,255,.57),rgba(244,250,255,.62)),var(--stage);background-size:cover;background-position:center;overflow:hidden}
.result-card{width:min(1060px,100%);height:min(720px,calc(100dvh - 32px));display:grid;grid-template-columns:minmax(280px,42%) 1fr;align-items:center;gap:20px;padding:clamp(18px,3vw,38px);border-radius:32px;background:rgba(255,255,255,.95);border:2px solid rgba(255,255,255,.98);box-shadow:0 30px 80px rgba(31,79,116,.23);overflow:hidden}
.result-visual{height:100%;display:grid;place-items:center;position:relative}.trophy-art{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 22px rgba(31,79,116,.2))}
.result-copy{text-align:center}.result-copy h1{margin:0 0 6px;font-size:clamp(36px,4vw,58px);line-height:1;font-weight:950;color:#2e7fc5}.result-subtitle{font-size:clamp(21px,2vw,31px);font-weight:950;color:#d79817;margin-bottom:15px}.result-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:15px}.stat-card{padding:10px;border-radius:14px;background:#f1f8ff}.stat-card span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#668399}.stat-card strong{font-size:22px}.result-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.result-actions .btn{min-width:0;font-size:14px;padding-inline:8px}.result-actions .btn-primary{grid-column:auto}
.dialog-backdrop{position:fixed;inset:0;z-index:70;padding:14px;display:grid;place-items:center;background:rgba(23,54,75,.42)}
.dialog{width:min(780px,100%);max-height:calc(100dvh - 28px);overflow:hidden;border-radius:26px;background:#fff;box-shadow:0 25px 75px rgba(23,54,75,.3);display:grid;grid-template-rows:auto 1fr auto}

const AudioManager={
  bg:null,fx:null,synth:null,last:{bg:-1,correct:-1,wrong:-1},savedTrack:null,savedTime:0,unlocked:false,ctx:null,
  init(){this.unlocked=true;if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch{}}if(this.ctx?.state==="suspended")this.ctx.resume().catch(()=>{})},

  playing(){return!config.muted&&!!((this.bg&&!this.bg.paused)||(this.fx&&!this.fx.paused)||this.synth)},
  sync(){qsa('[data-action="mute"]').forEach(button=>{const off=config.muted;button.classList.toggle("sound-on",!off);button.classList.toggle("sound-off",off);button.innerHTML=icon(off?"mute":"volume");button.setAttribute("aria-label",off?"Bật âm thanh":"Tắt âm thanh");button.setAttribute("aria-pressed",String(!off))});qsa(".volume-value").forEach(el=>el.textContent=`${Math.round(config.volume*100)}%`);qsa('[data-volume]').forEach(el=>el.value=String(Math.round(config.volume*100)));document.documentElement.dataset.audioPlaying=String(this.playing())},
  setVolume(value){config.volume=clamp(Number(value),0,1);if(this.bg)this.bg.volume=config.muted?0:config.volume;if(this.fx)this.fx.volume=config.muted?0:config.volume;if(this.synth)this.synth.gain.gain.value=config.muted?0:.018*Math.max(.15,config.volume);saveConfig();this.sync()},
  async toggle(){this.init();if(!config.muted){config.muted=true;this.pauseBg();this.stopFx();saveConfig();this.sync();return}config.muted=false;saveConfig();const ok=await this.playBg(!!this.bg);if(!ok)this.beep(true);this.sync()},

  startSynthBg(){if(this.synth||!this.ctx||config.muted)return false;try{const gain=this.ctx.createGain(),lfo=this.ctx.createOscillator(),lfoGain=this.ctx.createGain(),tones=[174.61,261.63].map((frequency,index)=>{const oscillator=this.ctx.createOscillator();oscillator.type=index?"sine":"triangle";oscillator.frequency.value=frequency;oscillator.connect(gain);oscillator.start();return oscillator});gain.gain.value=.018*Math.max(.15,config.volume);lfo.frequency.value=.12;lfoGain.gain.value=.006;lfo.connect(lfoGain).connect(gain.gain);gain.connect(this.ctx.destination);lfo.start();this.synth={gain,lfo,tones};this.sync();return true}catch{return false}},
  stopSynthBg(){if(!this.synth)return;try{this.synth.tones.forEach(oscillator=>oscillator.stop());this.synth.lfo.stop();this.synth.gain.disconnect()}catch{}this.synth=null},
  pauseBg(){if(this.bg){this.savedTrack=this.bg.src;this.savedTime=this.bg.currentTime||0;this.bg.pause()}this.stopSynthBg();this.sync()},
  async playBg(resume=false){if(!this.unlocked||config.muted||!config.music){this.sync();return false}this.stopFx();if(!this.bg||!resume){this.bg=new Audio(this.pick(AUDIO_FILES.bg,"bg"));this.bg.loop=false;this.bg.addEventListener("ended",()=>this.playBg(false),{once:true})}this.bg.volume=config.volume;try{if(resume&&this.savedTrack===this.bg.src)this.bg.currentTime=this.savedTime||0;await this.bg.play();this.stopSynthBg();this.sync();return true}catch{const fallback=this.startSynthBg();this.sync();return fallback}},
  feedback(correct){this.pauseBg();this.stopFx();const key=correct?"correct":"wrong",fx=this.fx=new Audio(this.pick(AUDIO_FILES[key],key));fx.volume=config.muted?0:config.volume;let finished=false;const resume=()=>{if(finished)return;finished=true;this.stopFx();this.playBg(true)};fx.addEventListener("ended",resume,{once:true});fx.addEventListener("error",()=>{this.beep(correct);setTimeout(resume,700)},{once:true});try{fx.play().then(()=>this.sync()).catch(()=>{this.beep(correct);setTimeout(resume,700)})}catch{this.beep(correct);setTimeout(resume,700)}setTimeout(resume,4200)},
  beep(ok){if(!this.ctx||config.muted)return;try{const osc=this.ctx.createOscillator(),gain=this.ctx.createGain();osc.frequency.value=ok?660:190;gain.gain.setValueAtTime(.001,this.ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.075*config.volume,this.ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.34);osc.connect(gain).connect(this.ctx.destination);osc.start();osc.stop(this.ctx.currentTime+.35)}catch{}},
  pauseAll(){this.pauseBg();this.stopFx()}
};

const LayoutDiagnostics={
  rectsOverlap(a,b){return!(a.right<=b.left||b.right<=a.left||a.bottom<=b.top||b.bottom<=a.top)},
  measure(){const selectors=[".topbar",".tower-panel",".question-card",".answer-grid",".lifeline-row",".feedback-bar"],rects={};for(const selector of selectors){const el=qs(selector);if(el){const r=el.getBoundingClientRect();rects[selector]={x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}}}const root=document.documentElement;return{viewport:`${innerWidth}×${innerHeight}`,overflow:{x:root.scrollWidth-root.clientWidth,y:root.scrollHeight-root.clientHeight},rects}}
};

function toast(message){clearTimeout(toastTimer);toastEl.textContent=message;toastEl.classList.add("show");toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2600)}
function recordError(error){errors.push({time:new Date().toISOString(),message:String(error?.message||error)});if(errors.length>20)errors.shift();updateDebug()}
window.addEventListener("error",event=>recordError(event.error||event.message));
window.addEventListener("unhandledrejection",event=>recordError(event.reason));

function header({playing=false}={}){const current=game?Math.min(game.currentIndex+1,game.questionOrder.length):0,total=game?.questionOrder?.length||config.questionCount;return `<header class="topbar"><div class="brand"><span class="brand-mark">${icon("book")}</span><span class="brand-name">TRIỆU PHÚ TRI THỨC</span></div><div class="top-center">${playing?`<span class="pill">CÂU <strong>${current}/${total}</strong></span><span class="pill"><strong>${formatPoints(game.score)}</strong> ĐIỂM TRI THỨC</span>`:`<span class="pill">HÀNH TRÌNH 15 BẬC</span>`}</div><div class="top-actions">${playing?`<button class="icon-btn" data-action="pause" aria-label="Tạm dừng">${icon("pause")}</button>`:""}<button class="icon-btn ${config.muted?"sound-off":""}" data-action="mute" aria-label="${config.muted?"Bật":"Tắt"} âm thanh">${icon(config.muted?"mute":"volume")}</button><button class="icon-btn" data-action="volume-down" aria-label="Giảm âm lượng">−</button><span class="volume-wrap"><input data-volume type="range" min="0" max="100" value="${Math.round(config.volume*100)}" aria-label="Âm lượng"><span class="volume-value">${Math.round(config.volume*100)}%</span></span><button class="icon-btn" data-action="volume-up" aria-label="Tăng âm lượng">+</button>${playing?`<button class="icon-btn" data-action="help" aria-label="Hướng dẫn">${icon("help")}</button>`:""}<button class="icon-btn" data-action="fullscreen" aria-label="Toàn màn hình">${icon("full")}</button>${playing?`<button class="icon-btn" data-action="home" aria-label="Về màn chính trò chơi">${icon("home")}</button>`:""}</div></header>`}

function renderHome(){stopTimer();if(game)saveGame();app.style.setProperty("--stage",`url(${ASSETS.stage})`);app.innerHTML=`<section class="screen">${header()}<main class="home-main"><section class="hero-copy"><div class="eyebrow"><span class="eyebrow-dot"></span> TRÒ CHƠI TRẮC NGHIỆM 15 BẬC</div><h1 class="hero-title"><span class="millionaire">TRIỆU PHÚ</span><span class="knowledge">TRI THỨC</span></h1><p class="tagline">15 BẬC THỬ THÁCH · CHINH PHỤC TRI THỨC · CHẠM ĐẾN ĐỈNH CAO</p><div class="hero-actions"><button class="btn btn-primary" data-action="quick-start">${icon("play")} BẮT ĐẦU HÀNH TRÌNH</button><button class="btn btn-secondary" data-action="setup-questions">${icon("file")} NHẬP CÂU HỎI</button><button class="btn btn-soft" data-action="setup-paste">${icon("paste")} DÁN NHANH</button><button class="btn btn-secondary" data-action="setup-settings">${icon("settings")} CÀI ĐẶT</button><button class="btn btn-soft" data-action="import-file">${icon("upload")} NHẬP FILE</button></div><div class="hero-utils"><button class="utility-btn" data-action="continue" ${game&&game.state!=="COMPLETED"?"":"disabled"}>${icon("refresh")} TIẾP TỤC LƯỢT CHƠI</button><button class="utility-btn" data-action="help">${icon("help")} HƯỚNG DẪN</button><button class="utility-btn" data-action="library">${icon("home")} TẤT CẢ CÁC TRÒ CHƠI</button></div></section><section class="hero-visual" aria-label="Đài Tri Thức 15 bậc"><div class="hero-orbit"></div><img class="tower-art" src="${ASSETS.tower}" alt="Đài Tri Thức gồm 15 tầng với tinh cầu ở đỉnh"><div class="hero-chip one">15 BẬC TRI THỨC</div><div class="hero-chip two">3 QUYỀN TRỢ GIÚP</div><div class="academic-dots"><span class="academic-dot">${icon("atom")}</span><span class="academic-dot">${icon("globe")}</span><span class="academic-dot">${icon("bulb")}</span></div></section></main></section>`;AudioManager.sync();updateDebug()}

function createGame(){const count=Math.min(config.questionCount,config.questions.length),allIds=config.questions.map(q=>q.id),selected=config.shuffle?fisher(allIds).slice(0,count):allIds.slice(0,count),reserve=allIds.filter(id=>!selected.includes(id));game={version:1,state:"QUESTION",questionOrder:selected,reserveQuestions:reserve,currentIndex:0,score:0,correct:0,wrong:0,answers:[],levelStates:Array(count).fill("upcoming"),lifelines:{fifty:false,hint:false,swap:false},hiddenOptions:[],inputLocked:false,timeLeft:config.timer||null,elapsedTime:0,lastTick:now(),startedAt:now(),settings:{questionCount:count,shuffle:config.shuffle,timer:config.timer,wrongMode:config.wrongMode},safeLevel:0,usedQuestions:[...selected],savedAt:now()};saveGame();AudioManager.playBg(false);renderGame()}
function currentQuestion(){if(!game)return null;const id=game.questionOrder[game.currentIndex];return config.questions.find(q=>q.id===id)||SAMPLE_QUESTIONS.find(q=>q.id===id)||null}
function currentPoints(){return POINTS[Math.min(game.currentIndex,POINTS.length-1)]||0}
function isMilestone(index,total){return index===4||index===9||index===14||index===total-1}

function towerMarkup(){const total=game.questionOrder.length,rows=Array.from({length:total},(_,i)=>{const index=total-1-i,state=game.levelStates[index]||"upcoming",current=index===game.currentIndex&&game.state!=="COMPLETED",milestone=isMilestone(index,total);return `<div class="level-row ${state} ${current?"current":""} ${milestone?"milestone":""}"><span class="level-number">${String(index+1).padStart(2,"0")}</span><span><span class="level-points">${formatPoints(POINTS[index])}</span><span class="level-label"> · ĐIỂM</span></span><span>${milestone?"◆":""}</span></div>`}).join("");return `<section class="tower-panel"><div class="panel-title"><span>THÁP TRI THỨC</span><span class="tower-badge">${game.correct}/${total} BẬC</span></div><div class="level-list" style="--levels:${total}">${rows}</div></section><div class="mobile-progress"><div class="mobile-progress-top"><span>BẬC ${Math.min(game.currentIndex+1,total)} / ${total}</span><strong>${formatPoints(game.score)} ĐIỂM</strong></div><div class="progress-dots" style="--levels:${total}">${game.levelStates.map((state,i)=>`<span class="progress-dot ${state} ${i===game.currentIndex?"current":""} ${isMilestone(i,total)?"milestone":""}"></span>`).join("")}</div></div>`}
function questionMarkup(){const q=currentQuestion();if(!q)return `<section class="empty-question"><div class="empty-copy"><h2>Không tìm thấy câu hỏi</h2><p>Hãy quay về màn chính và kiểm tra lại bộ câu hỏi.</p></div></section>`;const resolved=game.state==="FEEDBACK",longQuestion=q.question.length>190,longAnswers=q.options.some(option=>option.length>85);return `<section class="question-card"><div class="question-kicker">CÂU ${game.currentIndex+1} · ${formatPoints(currentPoints())} ĐIỂM TRI THỨC ${game.settings.timer?`· <span id="timerValue">${game.timeLeft}s</span>`:""}</div><div class="question-text ${longQuestion?"long":""}">${esc(q.question)}</div></section><section class="answer-grid ${longAnswers?"answers-long":""}">${q.options.map((option,index)=>{const answer=game.answers[game.answers.length-1],isCorrect=resolved&&index===q.answer,isWrong=resolved&&answer?.selected===index&&!answer.correct,selected=game.selectedAnswer===index&&!resolved,hidden=game.hiddenOptions.includes(index);return `<button class="answer-card ${selected?"selected":""} ${isCorrect?"correct":""} ${isWrong?"wrong":""} ${hidden?"hidden-option":""}" data-action="answer" data-index="${index}" ${game.inputLocked||hidden?"disabled":""}><span class="answer-badge">${"ABCD"[index]}</span><span>${esc(option)}</span><span class="answer-mark">${isCorrect?"✓":isWrong?"×":""}</span></button>`}).join("")}</section>${lifelineMarkup()}${feedbackMarkup(q)}`}
function lifelineMarkup(){const q=currentQuestion(),disabled=game.state!=="QUESTION"||game.inputLocked;return `<section class="lifeline-row" aria-label="Quyền trợ giúp"><button class="lifeline ${game.lifelines.fifty?"used":""}" data-action="fifty" ${disabled||game.lifelines.fifty?"disabled":""}>${icon("half")} LOẠI 2 PHƯƠNG ÁN</button><button class="lifeline ${game.lifelines.hint?"used":""}" data-action="hint" ${disabled||game.lifelines.hint||!q?.hint?"disabled":""}>${icon("bulb")} GỢI Ý KIẾN THỨC</button><button class="lifeline ${game.lifelines.swap?"used":""}" data-action="swap" ${disabled||game.lifelines.swap||!game.reserveQuestions.length?"disabled":""}>${icon("swap")} ĐỔI CÂU HỎI</button></section>`}
function feedbackMarkup(q){if(game.state!=="FEEDBACK")return `<footer class="feedback-bar"><div><div class="feedback-title">Hãy chọn đáp án A–B–C–D</div><div class="feedback-detail">Bạn có thể dùng một quyền trợ giúp trước khi trả lời.</div></div><button class="feedback-next" data-action="pause">TẠM DỪNG</button></footer>`;const answer=game.answers[game.answers.length-1],safe=answer.correct&&isMilestone(game.currentIndex,game.questionOrder.length),challengeStops=!answer.correct&&game.settings.wrongMode==="challenge";return `<footer class="feedback-bar ${answer.correct?"good":"bad"} ${safe?"safe":""}"><div><div class="feedback-title">${answer.correct?safe?"CHÍNH XÁC! ĐÃ KÍCH HOẠT MỐC TRI THỨC":"CHÍNH XÁC!":"CHƯA CHÍNH XÁC!"}</div><div class="feedback-detail">${esc(q.explanation||`Đáp án đúng là ${"ABCD"[q.answer]}.`)}</div></div><button class="feedback-next" data-action="next-question">${challengeStops||game.currentIndex+1>=game.questionOrder.length?"XEM KẾT QUẢ":"TIẾP TỤC"}</button></footer>`}
function renderGame(){if(!game)return renderHome();if(game.state==="COMPLETED")return renderResult();app.style.setProperty("--stage",`url(${ASSETS.stage})`);app.innerHTML=`<section class="screen">${header({playing:true})}<main class="game-main"><aside class="progress-zone">${towerMarkup()}<div class="progress-foot"><div class="score-card"><span>ĐIỂM TRI THỨC</span><strong>${formatPoints(game.score)}</strong></div><button class="utility-btn" data-action="pause">${icon("pause")} TẠM DỪNG</button></div></aside><section class="question-zone">${questionMarkup()}</section></main></section>`;AudioManager.sync();if(game.state==="QUESTION")startTimer();updateDebug();requestAnimationFrame(()=>LayoutDiagnostics.measure())}

function renderResult(){stopTimer();AudioManager.pauseAll();if(!game)return renderHome();const used=Object.values(game.lifelines).filter(Boolean).length,totalSeconds=Math.max(0,Math.round(game.elapsedTime/1000));app.style.setProperty("--stage",`url(${ASSETS.stage})`);app.innerHTML=`<section class="result-screen"><article class="result-card"><div class="result-visual"><img class="trophy-art" src="${ASSETS.trophy}" alt="Huy hiệu Triệu phú Tri thức"></div><div class="result-copy"><h1>CHÚC MỪNG!</h1><div class="result-subtitle">${game.correct===game.questionOrder.length?"BẠN ĐÃ TRỞ THÀNH TRIỆU PHÚ TRI THỨC!":"BẠN ĐÃ HOÀN THÀNH HÀNH TRÌNH TRI THỨC!"}</div><div class="result-stats"><div class="stat-card"><span>CÂU ĐÚNG</span><strong>${game.correct}</strong></div><div class="stat-card"><span>CÂU SAI</span><strong>${game.wrong}</strong></div><div class="stat-card"><span>ĐIỂM TRI THỨC</span><strong>${formatPoints(game.score)}</strong></div><div class="stat-card"><span>TRỢ GIÚP ĐÃ DÙNG</span><strong>${used}/3</strong></div><div class="stat-card"><span>THỜI GIAN</span><strong>${Math.floor(totalSeconds/60)}:${String(totalSeconds%60).padStart(2,"0")}</strong></div><div class="stat-card"><span>MỐC AN TOÀN</span><strong>${game.safeLevel||0}</strong></div></div><div class="result-actions"><button class="btn btn-primary" data-action="play-again">${icon("refresh")} CHƠI LẠI</button><button class="btn btn-soft" data-action="setup-questions">${icon("file")} ĐỔI CÂU HỎI</button><button class="btn btn-secondary" data-action="home">${icon("home")} TRANG CHỦ</button></div></div></article></section>`;burst(innerWidth/2,innerHeight/2,innerWidth<650?12:22);updateDebug()}

function questionsToText(questions=config.questions){return questions.map((q,index)=>`Câu ${index+1}: ${q.question}\nA. ${q.options[0]}\nB. ${q.options[1]}\nC. ${q.options[2]}\nD. ${q.options[3]}\nĐáp án: ${"ABCD"[q.answer]}\nGợi ý: ${q.hint||""}\nGiải thích: ${q.explanation||""}`).join("\n\n")}
function showSetup(step=1,mode=setupMode){setupStep=clamp(Number(step),1,4);setupMode=mode;stopTimer();app.innerHTML=`<section class="setup-screen"><div class="wizard"><header class="wizard-head"><div class="wizard-title-row"><h1 class="wizard-title">THIẾT LẬP HÀNH TRÌNH</h1><button class="icon-btn" data-action="home" aria-label="Đóng">${icon("close")}</button></div><div class="steps">${Array.from({length:4},(_,i)=>`<span class="step ${i+1<setupStep?"done":i+1===setupStep?"active":""}"></span>`).join("")}</div></header><main class="wizard-body">${setupContent()}</main><footer class="wizard-foot"><button class="btn btn-secondary" data-action="${setupStep===1?"home":"setup-back"}">${icon("back")} ${setupStep===1?"TRANG CHỦ":"QUAY LẠI"}</button><button class="btn btn-primary" data-action="${setupStep===4?"start-now":"setup-next"}">${setupStep===4?`${icon("play")} BẮT ĐẦU`:`TIẾP THEO ${icon("next")}`}</button></footer></div></section>`;updateDebug()}
function setupContent(){if(setupStep===1)return questionStep();if(setupStep===2)return settingsStep();if(setupStep===3)return previewStep();return readyStep()}
function questionStep(){const tools=`<h2>Bước 1 · Câu hỏi</h2><p class="lead">Nhập thủ công, dán nhanh, mở tệp TXT/CSV/JSON hoặc dùng bộ mẫu.</p><div class="question-tools"><button class="tool-card ${setupMode==="manual"?"active":""}" data-action="mode-manual">NHẬP THỦ CÔNG</button><button class="tool-card ${setupMode==="quick"?"active":""}" data-action="mode-quick">DÁN NHANH</button><button class="tool-card" data-action="import-file">NHẬP FILE</button><button class="tool-card" data-action="sample">DỮ LIỆU MẪU</button></div>`;if(setupMode==="manual")return`${tools}<div class="manual-editor"><div class="field"><label>Nội dung câu hỏi</label><input id="manualQuestion" placeholder="Nhập nội dung câu hỏi"></div><div class="manual-answers">${["A","B","C","D"].map(letter=>`<div class="field"><label>Đáp án ${letter}</label><input id="manual${letter}" placeholder="Lựa chọn ${letter}"></div>`).join("")}</div><div class="manual-bottom"><div class="field"><label>Đúng</label><select id="manualAnswer">${["A","B","C","D"].map((letter,index)=>`<option value="${index}">${letter}</option>`).join("")}</select></div><div class="field"><label>Gợi ý</label><input id="manualHint" placeholder="Không bắt buộc"></div><div class="field"><label>Giải thích</label><input id="manualExplanation" placeholder="Không bắt buộc"></div><button class="btn btn-soft" data-action="manual-add">${icon("check")} THÊM CÂU</button></div><div class="manual-status"><strong>${config.questions.length}</strong> câu hiện có <button class="utility-btn" data-action="manual-clear">XÓA BỘ HIỆN TẠI</button></div></div>`;return`${tools}<div class="editor-grid"><div class="field-card"><label>Định dạng hỗ trợ</label><textarea readonly>Câu 1: Nội dung câu hỏi\nA. Lựa chọn A\nB. Lựa chọn B\nC. Lựa chọn C\nD. Lựa chọn D\nĐáp án: B\nGợi ý: ...\nGiải thích: ...</textarea></div><div class="field-card"><label>Nội dung câu hỏi · <span id="questionCount">${config.questions.length} câu hợp lệ</span></label><textarea id="questionInput" spellcheck="false">${esc(questionsToText())}</textarea><div id="validation" class="validation good">Sẵn sàng kiểm tra dữ liệu.</div></div></div>`}
function settingsStep(){return `<h2>Bước 2 · Cài đặt</h2><p class="lead">Chọn số bậc, thời gian và luật khi trả lời chưa chính xác.</p><div class="settings-grid"><div class="setting-card"><div class="field"><label>Số câu trong hành trình</label><select id="questionCountSetting">${[5,10,15].map(n=>`<option value="${n}" ${config.questionCount===n?"selected":""}>${n} câu</option>`).join("")}</select></div></div><div class="setting-card"><div class="field"><label>Trộn câu</label><select id="shuffleSetting"><option value="0" ${!config.shuffle?"selected":""}>Tắt · giữ thứ tự nhập</option><option value="1" ${config.shuffle?"selected":""}>Bật · chọn ngẫu nhiên</option></select></div></div><div class="setting-card"><div class="field"><label>Đồng hồ</label><select id="timerSetting">${[0,10,15,20,30,45,60].map(n=>`<option value="${n}" ${config.timer===n?"selected":""}>${n?n+" giây":"Tắt"}</option>`).join("")}</select></div></div><div class="setting-card"><div class="field"><label>Luật khi sai</label><select id="wrongModeSetting"><option value="practice" ${config.wrongMode==="practice"?"selected":""}>Luyện tập · tiếp tục</option><option value="challenge" ${config.wrongMode==="challenge"?"selected":""}>Thử thách · kết thúc lượt</option></select></div></div></div>`}
function previewStep(){const count=Math.min(config.questionCount,config.questions.length);return `<h2>Bước 3 · Xem trước</h2><p class="lead">Kiểm tra thang tiến trình và cấu hình trước khi bắt đầu.</p><div class="preview-grid"><div class="preview-card"><strong>Tháp ${count} bậc</strong><div class="preview-tower" style="--count:${count}">${Array.from({length:count},(_,i)=>`<div class="preview-step ${isMilestone(i,count)?"milestone":""}" style="height:${32+(i+1)/count*68}%">${i+1}</div>`).join("")}</div></div><div class="preview-card preview-summary"><div class="summary-row"><span>Câu hỏi hợp lệ</span><strong>${config.questions.length}</strong></div><div class="summary-row"><span>Số câu sẽ chơi</span><strong>${count}</strong></div><div class="summary-row"><span>Trộn câu</span><strong>${config.shuffle?"Bật":"Tắt"}</strong></div><div class="summary-row"><span>Đồng hồ</span><strong>${config.timer?config.timer+" giây":"Tắt"}</strong></div><div class="summary-row"><span>Chế độ</span><strong>${config.wrongMode==="practice"?"Luyện tập":"Thử thách"}</strong></div><div class="summary-row"><span>Trợ giúp</span><strong>3 quyền</strong></div></div></div>`}
function readyStep(){const count=Math.min(config.questionCount,config.questions.length);return `<h2>Bước 4 · Sẵn sàng!</h2><p class="lead">Mọi thiết lập đã được kiểm tra. Hãy bắt đầu hành trình chinh phục tri thức.</p><div class="ready-panel"><div class="preview-summary"><div class="summary-row"><span>Hành trình</span><strong>${count} bậc</strong></div><div class="summary-row"><span>Điểm tối đa</span><strong>${formatPoints(POINTS[count-1])}</strong></div><div class="summary-row"><span>Mốc tri thức</span><strong>${count>=15?"5 · 10 · 15":count>=10?"5 · 10":"5"}</strong></div><div class="summary-row"><span>Quyền trợ giúp</span><strong>LOẠI 2 · GỢI Ý · ĐỔI CÂU</strong></div></div><img class="ready-art" src="${ASSETS.trophy}" alt="Huy hiệu Triệu phú Tri thức"></div>`}

function collectSetup(){if(setupStep===1&&setupMode==="quick"){const input=qs("#questionInput");if(input){const parsed=parseQuestions(input.value);const validation=qs("#validation");if(parsed.errors.length){if(validation){validation.className="validation";validation.textContent=parsed.errors[0]}toast(parsed.errors[0]);return false}if(parsed.questions.length){config.questions=parsed.questions;if(validation){validation.className="validation good";validation.textContent=`Đã nhận ${parsed.questions.length} câu hỏi hợp lệ.`}}}}if(setupStep===2){config.questionCount=Number(qs("#questionCountSetting")?.value||config.questionCount);config.shuffle=qs("#shuffleSetting")?.value==="1";config.timer=Number(qs("#timerSetting")?.value||0);config.wrongMode=qs("#wrongModeSetting")?.value||"practice"}config.questionCount=Math.min(config.questionCount,Math.max(1,config.questions.length));saveConfig();return config.questions.length>0}
function addManualQuestion(){const question=qs("#manualQuestion")?.value.trim(),options=["A","B","C","D"].map(letter=>qs(`#manual${letter}`)?.value.trim()||"");if(!question){toast("Vui lòng nhập nội dung câu hỏi.");return}const missing=options.findIndex(option=>!option);if(missing>=0){toast(`Câu hỏi thiếu đáp án ${"ABCD"[missing]}.`);return}config.questions.push({id:uid(),question,options,answer:Number(qs("#manualAnswer")?.value||0),hint:qs("#manualHint")?.value.trim()||"",explanation:qs("#manualExplanation")?.value.trim()||""});saveConfig();showSetup(1,"manual");toast("Đã thêm câu hỏi.")}

function normalizeQuestion(raw,index){const question=String(raw.question??"").trim(),options=raw.options||[raw.A,raw.B,raw.C,raw.D],answerRaw=raw.answer??raw.correct;const answer=typeof answerRaw==="number"?answerRaw:String(answerRaw??"").trim().toUpperCase().charCodeAt(0)-65;if(!question)return{error:`Câu ${index+1} thiếu nội dung.`};if(!Array.isArray(options))return{error:`Câu ${index+1} thiếu các đáp án A–D.`};const normalized=options.slice(0,4).map(value=>String(value??"").trim());for(let i=0;i<4;i++)if(!normalized[i])return{error:`Câu ${index+1} thiếu đáp án ${"ABCD"[i]}.`};if(answer<0||answer>3||!Number.isInteger(answer))return{error:`Câu ${index+1} có đáp án đúng là ${String(answerRaw||"trống")}, chỉ chấp nhận A–D.`};return{question:{id:String(raw.id||uid()),question,options:normalized,answer,hint:String(raw.hint??raw["gợi ý"]??"").trim(),explanation:String(raw.explanation??raw["giải thích"]??"").trim()}}}
function parseQuestions(text){const errors=[],questions=[],blocks=String(text||"").replace(/\r/g,"").split(/\n\s*\n+/).filter(block=>block.trim());for(let index=0;index<blocks.length;index++){const lines=blocks[index].split("\n").map(line=>line.trim()).filter(Boolean),raw={options:Array(4).fill("")};for(const line of lines){let match;if((match=line.match(/^(?:Câu(?:\s*\d+)?|C\s*\d+)\s*[:.)-]\s*(.+)$/i)))raw.question=match[1];else if((match=line.match(/^([A-Da-d])\s*[.):]\s*(.+)$/))){raw.options[match[1].toUpperCase().charCodeAt(0)-65]=match[2]}else if((match=line.match(/^(?:Đáp\s*án|Dap\s*an|Answer)\s*:\s*([A-Da-d])/i)))raw.answer=match[1];else if((match=line.match(/^(?:Gợi\s*ý|Goi\s*y|Hint)\s*:\s*(.*)$/i)))raw.hint=match[1];else if((match=line.match(/^(?:Giải\s*thích|Giai\s*thich|Explanation)\s*:\s*(.*)$/i)))raw.explanation=match[1];else if(!raw.question)raw.question=line}const result=normalizeQuestion(raw,index);if(result.error)errors.push(result.error);else questions.push(result.question)}return{questions,errors}}
function splitCSVLine(line){const values=[];let value="",quoted=false;for(let i=0;i<line.length;i++){const char=line[i];if(char==='"'){if(quoted&&line[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(char===","&&!quoted){values.push(value.trim());value=""}else value+=char}values.push(value.trim());return values}
function parseCSV(text){const lines=String(text||"").replace(/\r/g,"").split("\n").filter(line=>line.trim());if(lines.length<2)return{questions:[],errors:["Tệp CSV chưa có dữ liệu câu hỏi."]};const headers=splitCSVLine(lines.shift()).map(value=>value.toLowerCase()),questions=[],errors=[];lines.forEach((line,index)=>{const values=splitCSVLine(line),row={};headers.forEach((header,i)=>row[header]=values[i]??"");const result=normalizeQuestion({question:row.question,A:row.a,B:row.b,C:row.c,D:row.d,answer:row.answer,hint:row.hint,explanation:row.explanation},index);if(result.error)errors.push(result.error);else questions.push(result.question)});return{questions,errors}}
function parseJSON(text){try{const data=JSON.parse(text);if(!Array.isArray(data))return{questions:[],errors:["JSON phải là một mảng câu hỏi."]};const questions=[],errors=[];data.forEach((raw,index)=>{const result=normalizeQuestion(raw,index);if(result.error)errors.push(result.error);else questions.push(result.question)});return{questions,errors}}catch{return{questions:[],errors:["Tệp JSON không hợp lệ."]}}}
function importQuestions(){fileInput.click()}
fileInput.addEventListener("change",async()=>{const file=fileInput.files?.[0];if(!file)return;try{const text=await file.text(),ext=file.name.split(".").pop().toLowerCase(),parsed=ext==="json"?parseJSON(text):ext==="csv"?parseCSV(text):parseQuestions(text);if(parsed.errors.length||!parsed.questions.length){toast(parsed.errors[0]||"Tệp không có câu hỏi hợp lệ.");return}config.questions=parsed.questions;config.questionCount=[5,10,15].filter(n=>n<=parsed.questions.length).pop()||parsed.questions.length;saveConfig();toast(`Đã nhập ${parsed.questions.length} câu hỏi.`);showSetup(1,"quick")}catch(error){toast(`Không thể đọc tệp: ${error.message}`)}finally{fileInput.value=""}});
function exportQuestions(){const data=config.questions.map(q=>({question:q.question,options:q.options,answer:"ABCD"[q.answer],hint:q.hint||"",explanation:q.explanation||""})),blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="cau-hoi-trieu-phu-tri-thuc.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function answerQuestion(index,{timeout=false}={}){if(!game||game.state!=="QUESTION"||game.inputLocked)return false;const q=currentQuestion();if(!q||(!timeout&&game.hiddenOptions.includes(index)))return false;game.inputLocked=true;game.selectedAnswer=index;stopTimer();const correct=index===q.answer;game.answers.push({questionId:q.id,selected:index,correct,timeLeft:game.timeLeft,timeout});if(correct){game.correct++;game.score+=currentPoints();game.levelStates[game.currentIndex]="completed";if(isMilestone(game.currentIndex,game.questionOrder.length)){game.safeLevel=game.currentIndex+1;AudioManager.beep(true)}burst(innerWidth*.72,innerHeight*.48,innerWidth<650?5:isMilestone(game.currentIndex,game.questionOrder.length)?11:7)}else{game.wrong++;game.levelStates[game.currentIndex]="wrong-level"}game.state="FEEDBACK";AudioManager.feedback(correct);saveGame();renderGame();if(!correct&&game.settings.wrongMode==="challenge")setTimeout(()=>finishGame({challengeEnded:true}),900);return true}
function nextQuestion(){if(!game||game.state!=="FEEDBACK")return;const latest=game.answers[game.answers.length-1];if(game.settings.wrongMode==="challenge"&&latest&&!latest.correct){finishGame({challengeEnded:true});return}if(game.currentIndex+1>=game.questionOrder.length){finishGame();return}game.currentIndex++;game.state="QUESTION";game.selectedAnswer=null;game.hiddenOptions=[];game.inputLocked=false;game.timeLeft=game.settings.timer||null;game.lastTick=now();saveGame();renderGame()}
function finishGame({challengeEnded=false}={}){if(!game)return;stopTimer();if(challengeEnded){const safeIndex=Math.max(0,game.safeLevel-1);game.score=game.safeLevel?POINTS[safeIndex]:0}game.state="COMPLETED";game.challengeEnded=challengeEnded;saveGame();renderResult()}
function useFifty(){if(!game||game.state!=="QUESTION"||game.inputLocked||game.lifelines.fifty)return;const q=currentQuestion(),wrong=[0,1,2,3].filter(i=>i!==q.answer);game.hiddenOptions=fisher(wrong).slice(0,2);game.lifelines.fifty=true;saveGame();renderGame();toast("Đã loại chính xác 2 phương án sai.")}
function useHint(){if(!game||game.state!=="QUESTION"||game.inputLocked||game.lifelines.hint)return;const q=currentQuestion();if(!q?.hint){toast("Câu hỏi này chưa có gợi ý.");return}game.lifelines.hint=true;saveGame();renderGame();showDialog("GỢI Ý KIẾN THỨC",`<div class="hint-box">${icon("bulb")} ${esc(q.hint)}</div>`)}
function swapQuestion(){if(!game||game.state!=="QUESTION"||game.inputLocked||game.lifelines.swap)return;if(!game.reserveQuestions.length){toast("Ngân hàng không còn câu hỏi chưa sử dụng.");return}stopTimer();const replacement=game.reserveQuestions.shift(),old=game.questionOrder[game.currentIndex];game.questionOrder[game.currentIndex]=replacement;game.usedQuestions.push(replacement);game.reserveQuestions.push(old);game.lifelines.swap=true;game.hiddenOptions=[];game.selectedAnswer=null;game.timeLeft=game.settings.timer||null;saveGame();renderGame();toast("Đã đổi sang một câu hỏi mới.")}

function startTimer(){stopTimer();if(!game?.settings.timer||game.state!=="QUESTION")return;game.lastTick=now();timerId=setInterval(()=>{if(!game||game.state!=="QUESTION")return;const current=now(),delta=current-game.lastTick;game.lastTick=current;game.elapsedTime+=delta;if(delta>=850){game.timeLeft=Math.max(0,(game.timeLeft??game.settings.timer)-1);const value=qs("#timerValue");if(value)value.textContent=`${game.timeLeft}s`;if(game.timeLeft<=0){stopTimer();const q=currentQuestion(),visibleWrong=q?.options.findIndex((_,i)=>i!==q.answer&&!game.hiddenOptions.includes(i)),fallback=q?.answer===0?1:0;answerQuestion(visibleWrong>=0?visibleWrong:fallback,{timeout:true})}if(game.timeLeft%5===0)saveGame()}},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function pauseGame(){if(!game||game.state==="COMPLETED")return;stopTimer();game.previousState=game.state;game.state="PAUSED";AudioManager.pauseAll();saveGame();showDialog("TRÒ CHƠI ĐÃ TẠM DỪNG",`<div class="hint-box">Lượt chơi, điểm số, thời gian và quyền trợ giúp đã được lưu an toàn.</div>`,`<button class="btn btn-primary" data-action="resume">${icon("play")} TIẾP TỤC</button><button class="btn btn-secondary" data-action="home">${icon("home")} TRANG CHỦ</button>`)}
function resumeGame(){if(!game||game.state!=="PAUSED")return;game.state=game.previousState||"QUESTION";game.previousState=null;game.lastTick=now();modalRoot.innerHTML="";AudioManager.playBg(true);saveGame();renderGame()}
function resetGame(){stopTimer();AudioManager.pauseAll();clearGame();renderHome()}
function goHome(){stopTimer();AudioManager.pauseAll();if(game)saveGame();modalRoot.innerHTML="";renderHome()}

function toggleFullscreen(){const doc=document;if(!doc.fullscreenElement){doc.documentElement.requestFullscreen?.().catch(()=>toast("Trình duyệt không cho phép toàn màn hình."))}else doc.exitFullscreen?.()}

function burst(x,y,count=7){const amount=Math.min(count,innerWidth<650?12:24);for(let i=0;i<amount;i++){const spark=document.createElement("i");spark.className="spark";spark.style.left=`${x}px`;spark.style.top=`${y}px`;spark.style.background=["#ffd369","#55d9c6","#5ebbff","#ff7f78"][i%4];spark.style.setProperty("--dx",`${(Math.random()-.5)*180}px`);spark.style.setProperty("--dy",`${-45-Math.random()*150}px`);document.body.appendChild(spark);particleCount++;setTimeout(()=>{spark.remove();particleCount=Math.max(0,particleCount-1)},850)}}

function updateDebug(){if(!new URLSearchParams(location.search).has("debug")){qs(".debug-panel")?.remove();return}let panel=qs(".debug-panel");if(!panel){panel=document.createElement("pre");panel.className="debug-panel";document.body.appendChild(panel)}const layout=LayoutDiagnostics.measure(),questionFont=qs(".question-text")?getComputedStyle(qs(".question-text")).fontSize:"—",answerFont=qs(".answer-card")?getComputedStyle(qs(".answer-card")).fontSize:"—";panel.textContent=JSON.stringify({metadata:GAME_METADATA,viewport:layout.viewport,overflow:layout.overflow,fonts:{question:questionFont,answer:answerFont},audio:{muted:config.muted,volume:config.volume,playing:AudioManager.playing(),bg:AudioManager.bg?.src.split("/").pop()||null,fx:AudioManager.fx?.src.split("/").pop()||null},timer:{active:!!timerId,timeLeft:game?.timeLeft??null},gameState:game?.state||"HOME",rafCount:0,particleCount,storage:{config:!!localStorage.getItem(CONFIG_KEY),game:!!localStorage.getItem(STORAGE_KEY)},errors,rects:layout.rects},null,2)}

document.addEventListener("click",event=>{const button=event.target.closest("[data-action]");if(!button||button.disabled)return;AudioManager.init();const action=button.dataset.action,index=Number(button.dataset.index);if(action==="quick-start")showSetup(3);else if(action==="setup-questions")showSetup(1,"manual");else if(action==="setup-paste")showSetup(1,"quick");else if(action==="setup-settings")showSetup(2);else if(action==="import-file")importQuestions();else if(action==="continue"){if(game){if(game.state==="PAUSED")game.state=game.previousState||"QUESTION";AudioManager.playBg(true);renderGame()}}else if(action==="help")showHelp();else if(action==="close-modal")modalRoot.innerHTML="";else if(action==="library")goToLibrary();else if(action==="home")goHome();else if(action==="fullscreen")toggleFullscreen();else if(action==="mute")AudioManager.toggle();else if(action==="volume-down")AudioManager.setVolume(config.volume-.1);else if(action==="volume-up")AudioManager.setVolume(config.volume+.1);else if(action==="pause")pauseGame();else if(action==="resume")resumeGame();else if(action==="answer")answerQuestion(index);else if(action==="next-question")nextQuestion();else if(action==="fifty")useFifty();else if(action==="hint")useHint();else if(action==="swap")swapQuestion();else if(action==="setup-back"){collectSetup();showSetup(setupStep-1)}else if(action==="setup-next"){if(collectSetup())showSetup(setupStep+1)}else if(action==="start-now"){if(collectSetup())createGame()}else if(action==="mode-manual")showSetup(1,"manual");else if(action==="mode-quick")showSetup(1,"quick");else if(action==="manual-add")addManualQuestion();else if(action==="manual-clear"){config.questions=[];saveConfig();showSetup(1,"manual");toast("Đã xóa bộ câu hỏi hiện tại.")}else if(action==="sample"){config.questions=deepClone(SAMPLE_QUESTIONS);config.questionCount=15;saveConfig();showSetup(1,setupMode);toast("Đã nạp 18 câu hỏi mẫu.")}else if(action==="play-again")createGame()});
document.addEventListener("input",event=>{if(event.target.matches("[data-volume]"))AudioManager.setVolume(Number(event.target.value)/100)});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&modalRoot.innerHTML){if(game?.state==="PAUSED")return;modalRoot.innerHTML="";return}if(!game||game.state!=="QUESTION"||game.inputLocked)return;const key=event.key.toUpperCase(),index=["A","B","C","D"].indexOf(key),number=Number(event.key)-1;if(index>=0)answerQuestion(index);else if(number>=0&&number<4)answerQuestion(number)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&game?.state==="QUESTION")pauseGame()});
document.addEventListener("fullscreenchange",()=>qsa('[data-action="fullscreen"]').forEach(button=>button.setAttribute("aria-label",document.fullscreenElement?"Thoát toàn màn hình":"Toàn màn hình")));
window.addEventListener("resize",()=>requestAnimationFrame(updateDebug));

Object.assign(window,{startGame:createGame,pauseGame,resumeGame,resetGame,goHome,goToLibrary,importQuestions,exportQuestions,runSelfTests,getGameMetadata:()=>deepClone(GAME_METADATA)});
app.style.setProperty("--stage",`url(${ASSETS.stage})`);
renderHome();
document.documentElement.dataset.selfTests=JSON.stringify(runSelfTests());
</script>
</body>
</html>
